<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#faf9f6">
<title>Chế Độ Đọc - Dương Tấn Chánh</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,700;1,400&family=Roboto+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<style>
/* =========================================================
   1. RESET & BOX-SIZING
   ========================================================= */
*,
*::before,
*::after { box-sizing: border-box; }

html {
  margin: 0;
  padding: 0;
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  padding: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 1.1rem;
  font-weight: normal;
  line-height: 1.5;
  color: var(--ink);
  background-color: var(--paper);
  word-break: normal;
  overflow-wrap: break-word;
  transition: background-color 0.2s, color 0.2s;
}

/* =========================================================
   2. VARIABLES
   ========================================================= */
:root {
  --reader-fs: 1.5rem;
  --reader-lh: 1.75;
  --reader-mw: 37.5rem;
  --reader-ff: Georgia, "Times New Roman", "Noto Serif", serif;
  --svg-max-size: 12rem;
  --paper: #faf9f6;
  --ink: #1a1a1a;
  --line: #e6e1d6;
  --muted: #8a8578;
  --link: #b04a00;
  --accent: #2980b9;
  --accent-bg: rgba(52, 152, 219, 0.12);
  --accent-bg-hover: rgba(52, 152, 219, 0.22);
}

body.dark {
  --paper: #1c1a17;
  --ink: #d8d4cc;
  --line: #33302a;
  --muted: #7a766a;
  --link: #e8a06b;
  --accent: #6cb2eb;
  --accent-bg: rgba(108, 178, 235, 0.15);
  --accent-bg-hover: rgba(108, 178, 235, 0.25);
}

/* =========================================================
   3. BỐ CỤC CHUNG
   ========================================================= */
body {
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

body.modal-open {
  overflow: hidden !important;
}

/* =========================================================
   4. TOPBAR
   ========================================================= */
.topbar {
  flex: 0 0 auto;
  padding-top: 0;
  margin-top: 0;
}

/* =========================================================
   5. HEADER
   ========================================================= */
.page-header {
  position: relative;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: center;
  gap: 0.2rem 0.8rem;
  margin: 0 0 0.3rem;
  padding: 0 0.5rem;
}

.page-header-side {
  flex: 1 1 0;
  min-width: 0;
}

.page-header h1 {
  font-size: 2rem;
  font-weight: bold;
  text-align: center;
  text-transform: uppercase;
  letter-spacing: 0.04rem;
  line-height: 1;
  padding-top: 1rem;
  margin: 0;
  flex: 0 0 auto;
  color: var(--ink);
}

.page-header .author {
  font-size: 1.1rem;
  font-weight: normal;
  font-style: normal;
  text-align: right;
  line-height: 1.2;
  margin: 0;
  flex: 1 1 0;
  min-width: 0;
  color: var(--muted);
  white-space: nowrap;
}

.menu-close {
  display: none;
}

h2 { font-size: 1.3rem; font-weight: bold; margin: 1rem 0 0.5rem; }
h3 { font-size: 1.2rem; font-weight: bold; margin: 1rem 0 0.5rem; }
h4 { font-size: 1.1rem; font-weight: bold; margin: 1rem 0 0.5rem; }

/* =========================================================
   6. TOOLBAR
   ========================================================= */
.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem 0.6rem;
  align-items: center;
  padding: 0.35rem 0.5rem;
  border-bottom: 2px solid var(--line);
}

.toolbar-spacer { flex: 1 1 auto; }

select,
button {
  font-family: inherit;
  font-size: 0.9rem;
  font-weight: normal;
  line-height: 1.4;
  color: var(--ink);
  background-color: transparent;
  border: none;
  padding: 0.5rem 0.7rem;
  border-radius: 0.5rem;
  cursor: pointer;
  outline: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: background-color 0.12s, opacity 0.12s, color 0.12s;
}

select {
  border-bottom: 2px solid var(--line);
  border-radius: 0.4rem;
  padding: 0.3rem 0.5rem;
}

select:hover { border-bottom-color: var(--muted); }
select:disabled { opacity: 0.5; cursor: not-allowed; }

button:hover:not(:disabled) { background-color: rgba(128, 128, 128, 0.12); }
button.active { color: var(--link); font-weight: bold; }
button:disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }

#pasteBtn {
  background-color: var(--accent-bg);
  color: var(--accent);
  font-weight: bold;
}

#pasteBtn:hover:not(:disabled) { background-color: var(--accent-bg-hover); }

.mobile-only { display: none; }
.desktop-only { display: inline-flex; }

/* =========================================================
   7. CHẾ ĐỘ TOÀN MÀN HÌNH (desktop)
   ========================================================= */
body.is-fullscreen .page-header { display: none; }

body.is-fullscreen .toolbar {
  flex-wrap: nowrap;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

body.is-fullscreen .toolbar::-webkit-scrollbar { height: 0.4rem; }
body.is-fullscreen .toolbar::-webkit-scrollbar-thumb {
  background-color: var(--line);
  border-radius: 0.2rem;
}

body.is-fullscreen .toolbar > * { flex: 0 0 auto; }

/* =========================================================
   8. CHẾ ĐỘ "RỘNG SÁT LỀ"
   ========================================================= */
body.is-max-width #reader {
  max-width: none;
  width: 100%;
  margin: 0;
}

/* =========================================================
   9. BỐ CỤC CHÍNH
   ========================================================= */
.main {
  flex: 1 1 auto;
  min-height: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  transition: grid-template-columns 0.2s;
}

.main.reading-mode { grid-template-columns: 0 1fr; }

.side-input {
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 0.8rem;
  border-right: 2px solid var(--line);
  transition: opacity 0.2s;
}

.main.reading-mode .side-input {
  opacity: 0;
  pointer-events: none;
  overflow: hidden;
  padding: 0;
  border-right: none;
}

.side-read {
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 0;
  scrollbar-gutter: stable;
}

/* =========================================================
   10. Ô NHẬP
   ========================================================= */
#input {
  width: 100%;
  min-height: 100%;
  border: none;
  background-color: transparent;
  color: var(--ink);
  outline: none;
  font-family: inherit;
  font-size: 1rem;
  font-weight: normal;
  line-height: 1.6;
  word-break: normal;
  overflow-wrap: break-word;
  padding: 0;
  display: block;
}

#input:empty::before {
  content: attr(data-placeholder);
  color: var(--muted);
  font-style: normal;
  pointer-events: none;
  display: block;
  white-space: pre-line;
  line-height: 1.7;
}

#input * {
  color: inherit;
  background-color: transparent;
}

#input img {
  max-width: 100%;
  height: auto;
  display: block;
  margin: 0.5rem 0;
}

#input img[src$=".svg"],
#input img[src*=".svg?"],
#input img[src*=".svg#"],
#input img[src^="data:image/svg+xml"] {
  max-width: min(100%, var(--svg-max-size));
  max-height: var(--svg-max-size);
}

#input h1,
#input h2,
#input h3 {
  text-align: left;
  text-transform: none;
  font-size: 1.3rem;
  margin: 0.6rem 0 0.3rem;
}

#input ul,
#input ol { padding-left: 1.5rem; margin: 0.4rem 0; }

#input blockquote {
  margin: 0.6rem 0;
  padding: 0;
  color: var(--muted);
  font-style: italic;
}

#input pre {
  background-color: transparent;
  padding: 0;
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: 0.9rem;
  overflow-x: auto;
}

#input table,
#input thead,
#input tbody,
#input tr,
#input th,
#input td,
#input caption {
  display: block;
  border: none;
  padding: 0;
  margin: 0;
  background-color: transparent;
  width: auto;
}

#input th,
#input td { display: inline; }
#input tr { margin: 0 0 0.4rem; }
#input th::after,
#input td::after { content: " "; }

/* =========================================================
   11. VÙNG ĐỌC
   ========================================================= */
#reader {
  max-width: var(--reader-mw);
  margin: 0 auto;
  padding: 0.6rem;
  font-family: var(--reader-ff);
  font-size: var(--reader-fs);
  font-weight: normal;
  line-height: var(--reader-lh);
  color: var(--ink);
  word-break: normal;
  overflow-wrap: break-word;
}

#reader .article-title {
  font-family: inherit;
  font-size: 1.9em;
  font-weight: bold;
  margin: 0 0 0.5rem;
  color: var(--ink);
  text-align: left;
  text-transform: none;
  letter-spacing: normal;
}

#reader .article-meta {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 0.75em;
  font-weight: normal;
  color: var(--muted);
  margin: 0 0 2rem;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

#reader .article-meta .dot { margin: 0 0.5em; opacity: 0.5; }

#reader .article-body > *:first-child { margin-top: 0; }
#reader .article-body > *:last-child { margin-bottom: 0; }

#reader p { margin: 0 0 1.1em; }

#reader h1,
#reader h2,
#reader h3,
#reader h4,
#reader h5,
#reader h6 {
  font-family: inherit;
  font-weight: bold;
  color: var(--ink);
  text-align: left;
  text-transform: none;
  letter-spacing: normal;
}

#reader h1 { font-size: 1.5em; margin: 1.5em 0 0.6em; }
#reader h2 { font-size: 1.3em; margin: 1.4em 0 0.5em; }
#reader h3 { font-size: 1.15em; margin: 1.2em 0 0.5em; }
#reader h4 { font-size: 1em; margin: 1.1em 0 0.4em; }

#reader h5,
#reader h6 {
  font-size: 0.9em;
  margin: 1em 0 0.4em;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--muted);
}

#reader a {
  color: var(--link);
  text-decoration: underline;
  text-underline-offset: 0.15em;
  word-break: break-word;
}

#reader img {
  max-width: 100%;
  height: auto;
  display: block;
  margin: 1.2em auto;
}

#reader img[src$=".svg"],
#reader img[src*=".svg?"],
#reader img[src*=".svg#"],
#reader img[src^="data:image/svg+xml"] {
  max-width: min(100%, var(--svg-max-size));
  max-height: var(--svg-max-size);
}

#reader figure { margin: 1.2em 0; }

#reader figcaption {
  font-family: inherit;
  font-size: 0.9em;
  color: var(--muted);
  text-align: center;
  margin-top: 0.4em;
}

#reader ul,
#reader ol { margin: 0.6em 0 1.1em; padding-left: 1.6em; }

#reader li { margin: 0.35em 0; }

#reader blockquote {
  margin: 1.2em 0;
  padding: 0;
  border: none;
  color: var(--muted);
  font-style: italic;
}

#reader blockquote p:last-child { margin-bottom: 0; }

#reader hr {
  border: none;
  border-top: 2px solid var(--line);
  margin: 2em auto;
  width: 30%;
}

#reader table,
#reader thead,
#reader tbody,
#reader tfoot,
#reader tr,
#reader th,
#reader td,
#reader caption,
#reader col,
#reader colgroup {
  display: block;
  border: none;
  padding: 0;
  margin: 0;
  background-color: transparent;
  width: auto;
  max-width: 100%;
  font-size: inherit;
  font-weight: inherit;
  text-align: left;
  vertical-align: baseline;
}

#reader tr { margin: 0 0 0.8em; }
#reader th,
#reader td { display: inline; }
#reader th::after,
#reader td::after { content: " "; }

#reader code {
  font-family: "Roboto Mono", Consolas, ui-monospace, Menlo, Monaco, "Liberation Mono", "DejaVu Sans Mono", monospace;
  font-size: 0.9em;
}

#reader pre {
  border: none;
  padding: 0;
  margin: 1em 0;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  font-family: "Roboto Mono", Consolas, ui-monospace, Menlo, Monaco, "Liberation Mono", "DejaVu Sans Mono", monospace;
  font-size: 0.9em;
}

#reader pre code { font-size: 1em; }

#reader details {
  margin: 1em 0;
  padding: 0;
  border: none;
  font-size: 0.95em;
  color: var(--muted);
}

#reader summary {
  cursor: pointer;
  font-weight: bold;
  color: var(--ink);
}

#reader mark {
  background-color: #fff3a3;
  color: #1a1a1a;
  padding: 0 0.15em;
}

body.dark #reader mark {
  background-color: #8a7a00;
  color: #ffffff;
}

#reader b,
#reader strong { font-weight: bold; }

#reader i,
#reader em { font-style: italic; }

#reader u { text-decoration: underline; }

#reader s,
#reader del {
  text-decoration: line-through;
  color: var(--muted);
}

#reader sub,
#reader sup { font-size: 0.75em; line-height: 0; }

#reader small {
  font-size: 0.85em;
  color: var(--muted);
}

#reader .blocked-media {
  display: inline-block;
  padding: 0 0.3em;
  color: var(--muted);
  font-size: 0.85em;
  font-style: italic;
}

#reader .placeholder {
  text-align: center;
  color: var(--muted);
  padding: 3rem 1rem;
  font-size: 0.95rem;
  line-height: 1.8;
}

#reader .placeholder .big {
  display: block;
  font-size: 2rem;
  font-weight: bold;
  margin-bottom: 1rem;
  opacity: 0.4;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

#reader .placeholder .title {
  font-size: 1.1rem;
  color: var(--ink);
  font-weight: bold;
  margin-bottom: 0.8rem;
}

#reader .placeholder .hint {
  font-size: 0.9rem;
  background-color: rgba(128, 128, 128, 0.08);
  padding: 0.8rem 1rem;
  border-radius: 0.5rem;
  margin-top: 1rem;
  display: inline-block;
  text-align: left;
  line-height: 1.7;
}

#reader .placeholder .hint kbd {
  background-color: rgba(128, 128, 128, 0.2);
  padding: 0.1rem 0.4rem;
  border-radius: 0.25rem;
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: 0.9em;
}

#reader .extract-note {
  font-size: 0.85em;
  color: var(--muted);
  padding: 0;
  border: none;
  margin-bottom: 1.2em;
  font-style: italic;
}

/* =========================================================
   12. DROP OVERLAY
   ========================================================= */
.drop-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: rgba(26, 26, 26, 0.85);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  pointer-events: none;
}

.drop-overlay.is-visible { display: flex; }

.drop-overlay-inner {
  background-color: var(--paper);
  color: var(--ink);
  padding: 3rem 4rem;
  border-radius: 1rem;
  border: 3px dashed var(--accent);
  text-align: center;
  font-size: 1.5rem;
  font-weight: bold;
}

.drop-overlay-hint {
  display: block;
  font-size: 1rem;
  font-weight: normal;
  color: var(--muted);
  margin-top: 0.8rem;
}

/* =========================================================
   13. MODAL THÔNG BÁO
   ========================================================= */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: rgba(0, 0, 0, 0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2000;
  padding: 1.5rem;
  visibility: hidden;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease-out, visibility 0s 0.2s;
}

.modal-overlay.is-visible {
  visibility: visible;
  opacity: 1;
  pointer-events: auto;
  transition: opacity 0.2s ease-out, visibility 0s 0s;
}

.modal-card {
  position: relative;
  background-color: var(--paper);
  color: var(--ink);
  border: 2px solid var(--line);
  border-radius: 1rem;
  box-shadow: 0 1.2rem 3rem rgba(0, 0, 0, 0.4);
  padding: 2.2rem 2.4rem 1.8rem;
  max-width: 34rem;
  width: 100%;
  text-align: center;
  transform: translateY(0.6rem) scale(0.97);
  transition: transform 0.2s ease-out;
}

.modal-overlay.is-visible .modal-card {
  transform: translateY(0) scale(1);
}

.modal-icon {
  font-size: 3rem;
  line-height: 1;
  margin: 0 0 1rem;
  display: block;
  font-weight: bold;
}

.modal-icon.info    { color: var(--accent); }
.modal-icon.success { color: #2e7d32; }
.modal-icon.error   { color: #c62828; }
.modal-icon.warning { color: #ef6c00; }

body.dark .modal-icon.info    { color: var(--accent); }
body.dark .modal-icon.success { color: #81c784; }
body.dark .modal-icon.error   { color: #ef5350; }
body.dark .modal-icon.warning { color: #ffb74d; }

.modal-title {
  font-size: 1.4rem;
  font-weight: bold;
  line-height: 1.3;
  margin: 0 0 0.8rem;
  color: var(--ink);
}

.modal-message {
  font-size: 1.05rem;
  line-height: 1.65;
  color: var(--ink);
  margin: 0 0 1.6rem;
  white-space: pre-line;
  word-break: break-word;
  text-align: left;
}

.modal-message:last-child { margin-bottom: 0; }

.modal-actions {
  display: flex;
  gap: 0.7rem;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 0.6rem;
}

.modal-btn {
  font-family: inherit;
  font-size: 1.05rem;
  font-weight: bold;
  line-height: 1;
  padding: 0.85rem 2rem;
  min-width: 8rem;
  color: var(--paper);
  background-color: var(--ink);
  border: 2px solid var(--ink);
  border-radius: 0.6rem;
  cursor: pointer;
  outline: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  transition: opacity 0.12s, background-color 0.12s, color 0.12s;
}

.modal-btn:hover,
.modal-btn:focus-visible { opacity: 0.85; }

.modal-btn:active { opacity: 0.75; }

.modal-btn-cancel {
  color: var(--ink);
  background-color: transparent;
  border-color: var(--line);
}

.modal-btn-cancel:hover,
.modal-btn-cancel:focus-visible {
  background-color: rgba(128, 128, 128, 0.12);
  opacity: 1;
}

/* =========================================================
   14. NÚT NỔI
   ========================================================= */
.floating-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 3rem;
  min-height: 3rem;
  padding: 0.4rem 0.7rem;
  font-family: inherit;
  font-size: 0.85rem;
  font-weight: bold;
  line-height: 1.15;
  text-align: center;
  color: var(--paper);
  background-color: var(--ink);
  border: none;
  border-radius: 0.8rem;
  box-shadow: 0 0.2rem 0.5rem rgba(0, 0, 0, 0.25);
  cursor: pointer;
  outline: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  transition: none;
}

button.floating-btn:hover,
button.floating-btn:active {
  background-color: var(--ink);
  color: var(--paper);
}

.scroll-top {
  position: fixed;
  bottom: max(1rem, env(safe-area-inset-bottom));
  right: max(1rem, env(safe-area-inset-right));
  z-index: 100;
}

/* =========================================================
   15. CỤM NÚT GÓC DƯỚI TRÁI
   ========================================================= */
.bottom-left {
  display: none;
  position: fixed;
  bottom: max(1rem, env(safe-area-inset-bottom));
  left: max(1rem, env(safe-area-inset-left));
  z-index: 100;
  gap: 0.5rem;
}

#viewBtn {
  font-size: 0.85rem;
  line-height: 1.15;
  padding: 0.5rem 0.8rem;
}

/* =========================================================
   16. BACKDROP
   ========================================================= */
.menu-backdrop {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: rgba(0, 0, 0, 0.5);
  z-index: 290;
  -webkit-tap-highlight-color: transparent;
}

/* =========================================================
   17. MEDIA QUERIES — MOBILE (≤ 820px)
   ========================================================= */
@media (max-width: 820px) {
  body {
    display: block;
    height: auto;
    min-height: 100vh;
    overflow: auto;
    padding: 0 0 5rem;
  }

  body.menu-open { overflow: hidden; }

  .bottom-left { display: flex; }

  body.menu-open .bottom-left,
  body.menu-open .scroll-top { display: none; }

  .topbar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 300;
    max-height: 88vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    background-color: var(--paper);
    border-top: 2px solid var(--line);
    border-radius: 1rem 1rem 0 0;
    box-shadow: 0 -0.3rem 0.8rem rgba(0, 0, 0, 0.15);
    padding: 0.6rem 0.6rem max(0.6rem, env(safe-area-inset-bottom));

    transition: transform 0.25s ease-out;
  }

  .topbar.is-open { transform: translateY(0); }

  body.menu-open .menu-backdrop { display: block; }

  .page-header {
    flex-direction: column;

  }

  .page-header h1 {
    font-size: 1.3rem;

  .page-header .author {

  .menu-close {

  }

  .toolbar {
    padding: 0.4rem 0;
    border-bottom: none;

  }

  .toolbar button,
  .toolbar select {
    min-height: 2.6rem;
    padding: 0.55rem 0.85rem;

  }

  .main {
    display: block;
    overflow: visible;
  }

  .side-input,
  .side-read {
    display: none;
    overflow: visible;
    border: none;
    min-height: 0;

  }

  .side-input { padding: 0 0.8rem 1rem; }
  .side-read { padding: 0 0 1rem; }

  .main[data-view="input"]:not(.reading-mode) .side-input { display: block; }
  .main[data-view="read"] .side-read { display: block; }
  .main.reading-mode .side-input { display: none; }
  .main.reading-mode .side-read { display: block; }

  #reader { padding-top: 0; }

  #input {
    font-size: 1rem;

  }

  #reader .article-title { font-size: 1.5em; }

  .desktop-only { display: none; }

}

/* =========================================================
   18. MEDIA QUERIES — MÀN RẤT HẸP (≤ 480px)
   ========================================================= */
@media (max-width: 480px) {
  .page-header h1 { font-size: 1.2rem; }

  .modal-overlay { padding: 1rem; }

/* =========================================================
   19. KIỂU IN
   ========================================================= */
@media print {
  @page { margin: 2cm; }

  html,
  body {
    background: #ffffff !important;
    background-color: #ffffff !important;

}

<div class="main" id="main" data-view="input">
  <div class="side-input">
    <div id="input" contenteditable="true" spellcheck="false"
         autocorrect="off" autocapitalize="off"
         data-placeholder="Dán nội dung vào đây

Cách 1: Bấm nút Dán trong Menu.
Cách 2: Bấm nút Menu, chọn Chọn file để mở file .html, .htm, .txt.
Cách 3: Kéo thả file vào cửa sổ trình duyệt (máy tính).

Cũng có thể gõ trực tiếp."></div>

     aria-labelledby="modalTitle" aria-describedby="modalMsg">

      <button class="modal-btn modal-btn-cancel" id="modalCancelBtn" type="button" style="display:none;">Huỷ</button>

        aria-label="Cuộn lên đầu">Lên<br>đầu</button>

<script>
/* =========================================================
   THAM CHIẾU PHẦN TỬ
   ========================================================= */
const input          = document.getElementById('input');
const reader         = document.getElementById('reader');
const main           = document.getElementById('main');
const sideInput      = document.querySelector('.side-input');
const sideRead       = document.querySelector('.side-read');
const topbar         = document.getElementById('topbar');
const menuBtn        = document.getElementById('menuBtn');
const menuCloseBtn   = document.getElementById('menuCloseBtn');
const menuBackdrop   = document.getElementById('menuBackdrop');
const expandBtn      = document.getElementById('expandBtn');
const viewBtn        = document.getElementById('viewBtn');
const pasteBtn       = document.getElementById('pasteBtn');
const fileBtn        = document.getElementById('fileBtn');
const fileInput      = document.getElementById('fileInput');
const copyBtn        = document.getElementById('copyBtn');
const printBtn       = document.getElementById('printBtn');
const cleanBtn       = document.getElementById('cleanBtn');
const scrollTopBtn   = document.getElementById('scrollTopBtn');
const dropOverlay    = document.getElementById('dropOverlay');
const fontSizeSel    = document.getElementById('fontSize');
const fontFamilySel  = document.getElementById('fontFamily');
const lineHeightSel  = document.getElementById('lineHeight');
const maxWidthSel    = document.getElementById('maxWidth');
const paperColorSel  = document.getElementById('paperColor');
const exportTxtBtn   = document.getElementById('exportTxtBtn');
const exportHtmlBtn  = document.getElementById('exportHtmlBtn');
const shareBtn       = document.getElementById('shareBtn');
const bodyEl         = document.body;
const root           = document.documentElement;

const modalOverlay   = document.getElementById('modalOverlay');
const modalIcon      = document.getElementById('modalIcon');
const modalTitle     = document.getElementById('modalTitle');
const modalMsg       = document.getElementById('modalMsg');
const modalBtn       = document.getElementById('modalBtn');
const modalCancelBtn = document.getElementById('modalCancelBtn');

const isMobile = () => window.matchMedia('(max-width: 820px)').matches;

/* Hằng số SVG — dùng chung cho copy, export, in */
const SVG_MAX_SIZE = '12rem';
const SVG_MAX_WIDTH_CSS = 'min(100%, ' + SVG_MAX_SIZE + ')';

/* =========================================================
   MODAL THÔNG BÁO
   ========================================================= */
let modalAutoTimer     = null;
let modalOnConfirm     = null;
let modalOnCancel      = null;
let modalPreviousFocus = null;

const MODAL_ICONS = {
  info:    'ℹ',
  success: '✓',
  error:   '✕',
  warning: '⚠'
};

const MODAL_DEFAULT_TITLES = {
  info:    'Thông báo',
  success: 'Thành công',
  error:   'Lỗi',
  warning: 'Cảnh báo'
};

function showMessage(message, opts) {
  opts = opts || {};
  const type         = opts.type || 'info';
  const title        = (opts.title !== undefined) ? opts.title : (MODAL_DEFAULT_TITLES[type] || 'Thông báo');
  const buttonLabel  = opts.buttonLabel || 'OK';
  const cancelLabel  = opts.cancelLabel || '';
  const autoDismiss  = opts.autoDismiss || 0;

  if (modalAutoTimer) {
    clearTimeout(modalAutoTimer);
    modalAutoTimer = null;
  }
  modalOnConfirm = opts.onClose || null;
  modalOnCancel  = opts.onCancel || null;

  modalPreviousFocus = (document.activeElement && document.activeElement !== bodyEl)
    ? document.activeElement
    : null;

  modalIcon.textContent = MODAL_ICONS[type] || MODAL_ICONS.info;
  modalIcon.className   = 'modal-icon ' + type;

  if (title) {
    modalTitle.textContent   = title;
    modalTitle.style.display = '';
  } else {
    modalTitle.textContent   = '';
    modalTitle.style.display = 'none';
  }

  modalMsg.textContent  = message || '';
  modalBtn.textContent  = buttonLabel;

  if (cancelLabel) {
    modalCancelBtn.textContent   = cancelLabel;
    modalCancelBtn.style.display = '';
  } else {
    modalCancelBtn.textContent   = '';
    modalCancelBtn.style.display = 'none';
  }

  bodyEl.classList.add('modal-open');
  modalOverlay.classList.add('is-visible');

  setTimeout(() => {
    try { modalBtn.focus(); } catch (e) { /* bỏ qua */ }
  }, 60);

  if (autoDismiss > 0) {
    modalAutoTimer = setTimeout(() => hideModal('confirm'), autoDismiss);
  }
}

function hideModal(action) {
  if (!modalOverlay.classList.contains('is-visible')) return;

  if (modalAutoTimer) {
    clearTimeout(modalAutoTimer);
    modalAutoTimer = null;
  }

  modalOverlay.classList.remove('is-visible');
  bodyEl.classList.remove('modal-open');

  if (modalPreviousFocus &&
      modalPreviousFocus.isConnected &&
      typeof modalPreviousFocus.focus === 'function' &&
      !modalPreviousFocus.disabled) {
    try { modalPreviousFocus.focus(); } catch (e) { /* bỏ qua */ }
  }
  modalPreviousFocus = null;

  const isCancel = (action === 'cancel');
  const cb = isCancel ? modalOnCancel : modalOnConfirm;
  modalOnConfirm = null;
  modalOnCancel  = null;

  if (typeof cb === 'function') {
    try { cb(); } catch (e) { /* bỏ qua */ }
  }
}

modalBtn.addEventListener('click', () => hideModal('confirm'));
modalCancelBtn.addEventListener('click', () => hideModal('cancel'));

modalOverlay.addEventListener('click', e => {
  if (e.target === modalOverlay) hideModal('cancel');
});

function trapFocus(e) {
  const focusables = [];
  if (modalCancelBtn.style.display !== 'none') focusables.push(modalCancelBtn);
  focusables.push(modalBtn);

  if (focusables.length === 0) return;

  const first  = focusables[0];
  const last   = focusables[focusables.length - 1];
  const active = document.activeElement;

  if (focusables.length === 1) {
    e.preventDefault();
    first.focus();
    return;
  }

  if (e.shiftKey) {
    if (active === first || !focusables.includes(active)) {
      e.preventDefault();
      last.focus();
    }
  } else {
    if (active === last || !focusables.includes(active)) {
      e.preventDefault();
      first.focus();
    }
  }
}

/* =========================================================
   MENU MOBILE
   ========================================================= */
function openMenu() {
  if (!isMobile()) return;
  bodyEl.classList.add('menu-open');
  topbar.classList.add('is-open');
}

function closeMenu() {
  bodyEl.classList.remove('menu-open');
  topbar.classList.remove('is-open');
}

menuBtn.addEventListener('click', openMenu);
menuCloseBtn.addEventListener('click', closeMenu);
menuBackdrop.addEventListener('click', closeMenu);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (modalOverlay.classList.contains('is-visible')) {
      e.preventDefault();
      e.stopPropagation();
      if (modalCancelBtn.style.display !== 'none') {
        hideModal('cancel');
      } else {
        hideModal('confirm');
      }
      return;
    }
    if (bodyEl.classList.contains('menu-open')) {
      closeMenu();
    }
    return;
  }

  if (e.key === 'Tab' && modalOverlay.classList.contains('is-visible')) {
    trapFocus(e);
  }
});

/* =========================================================
   THEME COLOR
   ========================================================= */
function updateThemeColor() {
  const meta = document.querySelector('meta[name="theme-color"]');
  if (!meta) return;
  if (bodyEl.classList.contains('dark')) {
    meta.setAttribute('content', '#1c1a17');
  } else {
    meta.setAttribute('content', paperColorSel.value);
  }
}

/* =========================================================
   HÀM NỀN TẢNG
   ========================================================= */
const BLANK_RE = /[\s\u00A0\u200B\u200C\u200D\uFEFF\u2060]+/g;
function stripBlank(s) { return (s || '').replace(BLANK_RE, ''); }

function looksLikeHTML(text) {
  return /<\/?[a-z][\s\S]*>/i.test((text || '').trim());
}

function escapeHTML(s) {
  return s.replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
}

function safeURL(url) {
  if (!url) return '';
  const t = url.trim();
  if (/^(https?:|mailto:|tel:|#|\/|\.\/|\.\.\/)/i.test(t)) return t;
  if (/^data:image\/(png|jpe?g|gif|webp|svg\+xml);/i.test(t)) return t;
  return '';
}

function isSVGSource(src) {
  if (!src) return false;
  const s = String(src).toLowerCase().trim();
  return s.startsWith('data:image/svg+xml') || s.indexOf('.svg') !== -1;
}

function applySVGLimitToImages(rootEl) {
  rootEl.querySelectorAll('img').forEach(img => {
    const src = img.getAttribute('src') || '';
    if (isSVGSource(src)) {
      img.style.maxWidth = SVG_MAX_WIDTH_CSS;
      img.style.maxHeight = SVG_MAX_SIZE;
    }
  });
}

const ALLOWED_STYLE_PROPS = new Set([
  'text-align', 'font-weight', 'font-style', 'text-decoration',
  'text-transform', 'letter-spacing', 'list-style-type',
  'font-family', 'font-size', 'line-height',
  'max-width', 'max-height'
]);

function filterStyle(text) {
  if (!text) return '';
  const kept = [];
  text.split(';').forEach(rule => {
    const i = rule.indexOf(':');
    if (i < 0) return;
    const prop  = rule.slice(0, i).trim().toLowerCase();
    const value = rule.slice(i + 1).trim();
    if (!ALLOWED_STYLE_PROPS.has(prop)) return;
    if (/expression|javascript:|url\s*\(/i.test(value)) return;
    kept.push(prop + ': ' + value);
  });
  return kept.join('; ');
}

/* =========================================================
   WHITELIST
   ========================================================= */
const ALLOWED_TAGS = new Set([
  'p', 'div', 'section', 'article', 'figure', 'figcaption',
  'h1', 'h2', 'h3', 'h4', 'h5', 'h6',
  'ul', 'ol', 'li', 'dl', 'dt', 'dd',
  'blockquote', 'pre', 'hr', 'br',
  'details', 'summary',
  'a', 'span', 'strong', 'b', 'em', 'i', 'u', 's', 'del', 'ins', 'sub', 'sup',
  'mark', 'small', 'code', 'kbd', 'samp', 'var', 'abbr', 'cite', 'q', 'time', 'address',
  'img'
]);

const ALLOWED_ATTRS = {
  '*':       new Set(['title', 'dir', 'lang', 'style']),
  'a':       new Set(['href', 'name']),
  'img':     new Set(['src', 'alt', 'width', 'height']),
  'ol':      new Set(['start', 'type', 'reversed']),
  'li':      new Set(['value']),
  'time':    new Set(['datetime']),
  'details': new Set(['open'])
};

const STRIP_WITH_CONTENT = new Set([
  'script', 'style', 'noscript', 'template', 'iframe', 'object', 'embed',
  'form', 'input', 'textarea', 'select', 'option', 'button',
  'svg', 'math', 'canvas', 'video', 'audio', 'source', 'track',
  'link', 'meta', 'base', 'title', 'head',
  'table', 'thead', 'tbody', 'tfoot', 'tr', 'th', 'td', 'caption', 'col', 'colgroup'
]);

/* =========================================================
   KIỂM TRA NỘI DUNG NODE
   ========================================================= */
function hasVisibleContent(node) {
  if (node.nodeType === 3) return stripBlank(node.textContent).length > 0;
  if (node.nodeType !== 1) return false;

  const tag = node.tagName;
  if (['IMG', 'HR', 'VIDEO', 'AUDIO', 'IFRAME', 'TABLE',
       'UL', 'OL', 'BLOCKQUOTE', 'PRE', 'FIGURE', 'DETAILS',
       'H1', 'H2', 'H3', 'H4', 'H5', 'H6'].includes(tag)) return true;
  if (tag === 'BR') return false;

  if (stripBlank(node.textContent).length > 0) return true;
  if (node.querySelector('img, hr, ul, ol, blockquote, pre, figure, details, table')) return true;
  return false;
}

/* =========================================================
   PHÁ BẢNG
   ========================================================= */
function flattenTables(rootEl) {
  const tables = Array.from(rootEl.querySelectorAll('table')).reverse();
  for (const t of tables) {
    if (!t.isConnected) continue;

    const frag = document.createDocumentFragment();
    let rows = [];
    try { rows = Array.from(t.rows); }
    catch (e) { rows = Array.from(t.querySelectorAll('tr')); }

    rows.forEach(tr => {
      let cells = [];
      try { cells = Array.from(tr.cells); }
      catch (e) { cells = Array.from(tr.querySelectorAll('th, td')); }
      if (!cells.length) return;

      const p = document.createElement('p');
      let hasContent = false;

      cells.forEach(cell => {
        const text = stripBlank(cell.textContent);
        const hasRealMedia = !!cell.querySelector('img');
        if (!text && !hasRealMedia) return;
        if (hasContent) p.appendChild(document.createTextNode(' · '));
        while (cell.firstChild) p.appendChild(cell.firstChild);
        hasContent = true;
      });

      if (hasContent) frag.appendChild(p);
    });

    if (frag.childNodes.length) t.replaceWith(frag);
    else t.remove();
  }
}

function unwrapSingleChildWrappers(rootEl) {
  let changed = true;
  let loops = 0;
  while (changed && loops++ < 4) {
    changed = false;
    rootEl.querySelectorAll('div, section, article').forEach(el => {
      if (!el.isConnected) return;
      const kids = Array.from(el.childNodes).filter(n =>
        n.nodeType === 1 || (n.nodeType === 3 && stripBlank(n.textContent))
      );
      if (kids.length === 1 && kids[0].nodeType === 1) {
        const parent = el.parentNode;
        if (!parent) return;
        parent.insertBefore(kids[0], el);
        el.remove();
        changed = true;
      }
    });
  }
}

/* =========================================================
   SANITIZE
   ========================================================= */
function sanitizeHTML(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  flattenTables(doc.body);

  const all = Array.from(doc.body.querySelectorAll('*'));
  for (const el of all) {
    if (!el.isConnected) continue;
    const tag = el.tagName.toLowerCase();

    if (STRIP_WITH_CONTENT.has(tag)) { el.remove(); continue; }

    if (!ALLOWED_TAGS.has(tag)) {
      const parent = el.parentNode;
      if (!parent) continue;
      while (el.firstChild) parent.insertBefore(el.firstChild, el);
      el.remove();
      continue;
    }

    const allowed = new Set([
      ...(ALLOWED_ATTRS['*'] || []),
      ...(ALLOWED_ATTRS[tag] || [])
    ]);

    Array.from(el.attributes).forEach(attr => {
      const name  = attr.name.toLowerCase();
      const value = attr.value;

      if (name.startsWith('on')) { el.removeAttribute(attr.name); return; }
      if (name === 'class' || name === 'id') { el.removeAttribute(attr.name); return; }

      if (name === 'style') {
        const clean = filterStyle(value);
        if (clean) el.setAttribute('style', clean);
        else el.removeAttribute('style');
        return;
      }

      if (!allowed.has(name)) { el.removeAttribute(attr.name); return; }

      if (tag === 'img' && (name === 'width' || name === 'height')) {
        const num = parseInt(value, 10);
        if (!Number.isFinite(num) || num <= 0 || num > 4096) {
          el.removeAttribute(attr.name);
        } else {
          el.setAttribute(name, String(num));
        }
        return;
      }

      if (name === 'href' || name === 'src') {
        const clean = safeURL(value);
        if (clean) el.setAttribute(name, clean);
        else el.removeAttribute(name);
      }
    });

    if (tag === 'a' && el.hasAttribute('href')) {
      el.setAttribute('target', '_blank');
      el.setAttribute('rel', 'noopener noreferrer');
    }

    if (tag === 'img' && !el.hasAttribute('src')) {
      const span = doc.createElement('span');
      span.className = 'blocked-media';
      span.textContent = '[ảnh]';
      el.replaceWith(span);
    }
  }

  unwrapSingleChildWrappers(doc.body);
  return doc.body.innerHTML;
}

/* =========================================================
   LỌC NHIỄU
   ========================================================= */
const NOISE_SELECTORS = [
  'script', 'style', 'noscript', 'template', 'iframe', 'object', 'embed',
  'nav', 'header', 'footer', 'aside',
  '[role="navigation"]', '[role="banner"]', '[role="complementary"]',
  '[role="search"]', '[role="menu"]', '[role="menubar"]', '[role="dialog"]',
  'form', 'input', 'button', 'select', 'textarea', 'label',
  'svg', 'canvas', 'video', 'audio', 'source', 'track',
  'link', 'meta', 'base'
].join(',');

const NOISE_CLASS_RE = new RegExp(
  '(^|[-_ ])(' +
    'ad|ads|advert|advertisement|sponsor|sponsored|promo|banner|' +
    'sidebar|side-bar|rail|' +
    'menu|nav|navbar|navigation|breadcrumb|toolbar|topbar|' +
    'comment|comments|comment-list|comment-form|disqus|' +
    'social|share|sharing|share-bar|share-buttons|follow|' +
    'related|recommend|recommended|more-from|read-next|read-more|' +
    'newsletter|subscribe|signup|cta|call-to-action|' +
    'cookie|consent|gdpr|privacy-banner|' +
    'popup|modal|overlay|lightbox|' +
    'masthead|site-header|site-footer|page-header|page-footer|' +
    'widget|widgets|' +
    'byline|author-info|author-box|author-bio|author-avatar|' +
    'timestamp|publish-date|posted-on|date-published|' +
    'tags|tag-list|post-tags|article-tags|' +
    'rating|vote|votes|star-rating|' +
    'print|email-this|save-this|bookmark|' +
    'post-nav|prev-next|next-prev|pagination|pager|' +
    'meta|meta-info|post-meta|article-meta-strip|' +
    'skip-link|skip-to|screen-reader' +
  ')([-_ ]|$)', 'i'
);

function removeNoise(doc) {
  doc.querySelectorAll(NOISE_SELECTORS).forEach(el => el.remove());

  doc.querySelectorAll('[class],[id]').forEach(el => {
    if (!el.isConnected) return;
    const cls = (typeof el.className === 'string') ? el.className : '';
    if (NOISE_CLASS_RE.test(cls + ' ' + (el.id || ''))) el.remove();
  });

  let changed = true;
  let loops = 0;
  while (changed && loops++ < 8) {
    changed = false;
    doc.querySelectorAll('div, section, span, li, article, p, aside').forEach(el => {
      if (!el.isConnected) return;
      if (!hasVisibleContent(el)) { el.remove(); changed = true; }
    });
  }
}

/* =========================================================
   CHẤM ĐIỂM VÀ CHỌN CONTAINER
   ========================================================= */
function scoreElement(el) {
  const text = (el.textContent || '').trim();
  const textLen = text.length;
  if (textLen < 120) return 0;

  let pScore = 0;
  let pCount = 0;
  el.querySelectorAll('p').forEach(p => {
    const len = (p.textContent || '').trim().length;
    if (len >= 30) { pScore += len; pCount++; }
  });
  const base = pScore > 0 ? pScore : textLen;

  let linkLen = 0;
  el.querySelectorAll('a').forEach(a => linkLen += (a.textContent || '').trim().length);
  const linkDensity = textLen > 0 ? linkLen / textLen : 1;

  const tag = el.tagName.toLowerCase();
  let tagBoost = 1;
  if (tag === 'article') tagBoost = 3.2;
  else if (tag === 'main') tagBoost = 2.6;
  else if (tag === 'section') tagBoost = 1.25;

  const pBoost = 1 + Math.min(pCount, 12) * 0.05;
  let score = base * tagBoost * pBoost;
  score *= Math.max(0.04, 1 - linkDensity * 1.8);
  return score;
}

function findMainContainer(doc) {
  const cands = doc.body.querySelectorAll('article, main, [role="main"], section, div');
  let best = null;
  let bestScore = 0;
  cands.forEach(el => {
    const s = scoreElement(el);
    if (s > bestScore) { bestScore = s; best = el; }
  });
  return best || doc.body;
}

function extractTitle(doc, mainEl) {
  let h1 = mainEl.querySelector('h1') || doc.body.querySelector('h1');
  if (h1) {
    const t = h1.textContent.trim();
    if (t.length >= 4 && t.length <= 300) { h1.remove(); return t; }
  }

  const og = doc.querySelector('meta[property="og:title"], meta[name="og:title"]');
  if (og && og.getAttribute('content')) return og.getAttribute('content').trim();

  const t = doc.querySelector('title');
  if (t) {
    let s = t.textContent.trim();
    s = s.split(/\s+[|\-–—»·]\s+/)[0].trim();
    if (s.length >= 4) return s;
  }
  return '';
}

function normalizeBreaks(rootEl) {
  rootEl.querySelectorAll('*').forEach(el => {
    let prevBr = false;
    Array.from(el.childNodes).forEach(node => {
      if (node.nodeType === 1 && node.tagName === 'BR') {
        if (prevBr) node.remove(); else prevBr = true;
      } else if (node.nodeType === 3) {
        if (stripBlank(node.textContent)) prevBr = false;
      } else if (node.nodeType === 1) {
        prevBr = false;
      }
    });
  });

  rootEl.querySelectorAll('p, div, li, blockquote, h1, h2, h3, h4, h5, h6, article, section')
    .forEach(el => {
      while (el.lastChild) {
        const last = el.lastChild;
        if ((last.nodeType === 1 && last.tagName === 'BR') ||
            (last.nodeType === 3 && !stripBlank(last.textContent))) last.remove();
        else break;
      }
      while (el.firstChild) {
        const first = el.firstChild;
        if ((first.nodeType === 1 && first.tagName === 'BR') ||
            (first.nodeType === 3 && !stripBlank(first.textContent))) first.remove();
        else break;
      }
    });
}

function removeEmptyBlocks(rootEl) {
  let changed = true;
  let loops = 0;
  while (changed && loops++ < 8) {
    changed = false;
    const blocks = Array.from(
      rootEl.querySelectorAll('p, div, section, article, aside, span, li')
    ).filter(el => el.isConnected).reverse();
    for (const el of blocks) {
      if (!hasVisibleContent(el)) { el.remove(); changed = true; }
    }
  }
}

function trimEdges(container) {
  while (container.lastChild && !hasVisibleContent(container.lastChild)) {
    container.lastChild.remove();
  }
  while (container.firstChild && !hasVisibleContent(container.firstChild)) {
    container.firstChild.remove();
  }
}

function countStats(html) {
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  const words = (tmp.textContent || '').split(/\s+/)
    .filter(w => /[\p{L}\p{N}]/u.test(w)).length;
  const minutes = Math.max(1, Math.round(words / 220));
  return { words, minutes };
}

function extractArticle(rawHTML) {
  const doc = new DOMParser().parseFromString(rawHTML, 'text/html');
  removeNoise(doc);
  const mainEl = findMainContainer(doc);
  const title  = extractTitle(doc, mainEl);
  const cleanHTML = sanitizeHTML(mainEl.innerHTML);

  const wrap = document.createElement('div');
  wrap.innerHTML = cleanHTML;
  normalizeBreaks(wrap);
  removeEmptyBlocks(wrap);
  trimEdges(wrap);

  let note = '';
  if (stripBlank(wrap.textContent).length < 200) {
    note = 'Không tìm thấy bài viết rõ ràng — hiển thị toàn bộ nội dung đọc được.';
  }
  return { title, bodyHTML: wrap.innerHTML, note };
}

function isEmptySource(src) {
  if (!src || !src.trim()) return true;
  try {
    const tmp = document.createElement('div');
    tmp.innerHTML = src;
    if (tmp.querySelector('img, hr, video, audio, iframe, table, pre, blockquote')) return false;
    if (stripBlank(tmp.textContent)) return false;
    return true;
  } catch (e) {
    return !stripBlank(src);
  }
}

/* =========================================================
   VIEW MODE
   ========================================================= */
function setView(view) {
  if (view === 'input' && main.classList.contains('reading-mode')) {
    main.classList.remove('reading-mode');
    bodyEl.classList.remove('is-fullscreen');
    expandBtn.classList.remove('active');
    expandBtn.setAttribute('aria-label', 'Bật chế độ toàn màn hình');
    expandBtn.title = 'Chỉ giữ thanh nút, ẩn tiêu đề';
  }
  main.dataset.view = view;

  if (isMobile()) window.scrollTo(0, 0);

  if (view === 'read') {
    viewBtn.innerHTML = 'Đọc<br>▶ Sửa';
    viewBtn.setAttribute('aria-label', 'Quay lại ô nhập');
    viewBtn.title = 'Quay lại ô nhập';
  } else {
    viewBtn.innerHTML = 'Sửa<br>▶ Đọc';
    viewBtn.setAttribute('aria-label', 'Chuyển sang chế độ đọc');
    viewBtn.title = 'Chuyển sang chế độ đọc';
  }
  saveOpts();
}

viewBtn.addEventListener('click', () => {
  const next = main.dataset.view === 'read' ? 'input' : 'read';
  if (next === 'read' &&
      document.activeElement &&
      document.activeElement !== document.body) {
    document.activeElement.blur();
  }
  setView(next);
  closeMenu();
});

/* =========================================================
   CẬP NHẬT TRẠNG THÁI NÚT
   ========================================================= */
let _hasContentCache    = null;
let _hasContentCacheSig = '';

function hasReadableContent() {
  const sig = lastRenderSig;
  if (_hasContentCache !== null && _hasContentCacheSig === sig) {
    return _hasContentCache;
  }
  const result = !reader.querySelector('.placeholder')
      && stripBlank(reader.textContent).length > 0;
  _hasContentCache    = result;
  _hasContentCacheSig = sig;
  return result;
}

function updateActionButtons() {
  const has = hasReadableContent();
  copyBtn.disabled = !has;
  copyBtn.title = has ? 'Copy bài viết theo định dạng đang chọn' : 'Chưa có nội dung để copy';

  printBtn.disabled = !has;
  printBtn.title = has ? 'In bài viết' : 'Chưa có nội dung để in';

  exportTxtBtn.disabled = !has;
  exportTxtBtn.title = has ? 'Tải nội dung thành file .txt' : 'Chưa có nội dung để tải';

  exportHtmlBtn.disabled = !has;
  exportHtmlBtn.title = has ? 'Tải nội dung thành file .html' : 'Chưa có nội dung để tải';

  shareBtn.disabled = !has;
  shareBtn.title = has ? 'Chia sẻ bài viết' : 'Chưa có nội dung để chia sẻ';
}

/* =========================================================
   RENDER
   ========================================================= */
let lastRenderSig = '';

function render() {
  const src = input.innerHTML;

  if (isEmptySource(src)) {
    reader.innerHTML =
      '<div class="placeholder">' +
        '<span class="big">Chế độ đọc</span>' +
        '<div class="title">Chưa có nội dung</div>' +
        '<div>Dán văn bản hoặc mở file để bắt đầu.</div>' +
        '<div class="hint">' +
          '<b>Cách nhập:</b><br>' +
          '• Bấm nút <kbd>Menu</kbd> rồi chọn <kbd>Dán</kbd> để lấy clipboard<br>' +
          '• Bấm nút <kbd>Menu</kbd> để chọn file hoặc tuỳ chỉnh<br>' +
          '• Kéo thả file vào cửa sổ trình duyệt (máy tính)<br>' +
          '• Trên máy tính: <kbd>Ctrl</kbd>+<kbd>V</kbd> hoặc <kbd>⌘</kbd>+<kbd>V</kbd>' +
        '</div>' +
      '</div>';
    lastRenderSig = '';
    _hasContentCache    = null;
    _hasContentCacheSig = '';
    updateActionButtons();

    if (isMobile() && main.dataset.view === 'read') setView('input');
    return;
  }

  let title = '';
  let bodyHTML = '';
  let note = '';

  if (looksLikeHTML(src)) {
    const r = extractArticle(src);
    title = r.title;
    bodyHTML = r.bodyHTML;
    note = r.note;
  } else {
    bodyHTML = src.split(/\n\s*\n/)
      .map(b => '<p>' + escapeHTML(b).replace(/\n/g, '<br>') + '</p>')
      .join('');
  }

  const stats = countStats(bodyHTML);

  let html = '';
  if (title) {
    html += '<h1 class="article-title">' + escapeHTML(title) + '</h1>';
  }
  html += '<div class="article-meta">' +
            stats.words.toLocaleString('vi-VN') + ' từ' +
            '<span class="dot">·</span>~' + stats.minutes + ' phút đọc' +
          '</div>';
  if (note) {
    html += '<div class="extract-note">' + escapeHTML(note) + '</div>';
  }
  html += '<div class="article-body">' + bodyHTML + '</div>';

  const sig = title + '\u0001' + bodyHTML;
  const changed = sig !== lastRenderSig;
  lastRenderSig = sig;

  reader.innerHTML = html;

  _hasContentCache    = null;
  _hasContentCacheSig = '';

  if (changed) {
    if (sideRead) sideRead.scrollTop = 0;
  }

  updateActionButtons();
}

let renderTimer = null;
function renderDebounced() {
  clearTimeout(renderTimer);
  renderTimer = setTimeout(render, 120);
}

/* =========================================================
   CHÈN VÀO Ô NHẬP TẠI VỊ TRÍ CON TRỎ
   ========================================================= */
function insertAtCursor(html, text) {
  let toInsert;
  if (html && looksLikeHTML(html)) toInsert = sanitizeHTML(html);
  else toInsert = escapeHTML(text).replace(/\r?\n/g, '<br>');

  const sel = window.getSelection();
  if (!sel) return;

  if (sel.rangeCount === 0 || !input.contains(sel.anchorNode)) {
    input.focus();
    const range = document.createRange();
    range.selectNodeContents(input);
    range.collapse(false);
    sel.removeAllRanges();
    sel.addRange(range);
  }

  try {
    if (sel.rangeCount === 0) return;
    const range = sel.getRangeAt(0);
    range.deleteContents();
    const frag = range.createContextualFragment(toInsert);
    const last = frag.lastChild;
    range.insertNode(frag);
    if (last) {
      range.setStartAfter(last);
      range.collapse(true);
      sel.removeAllRanges();
      sel.addRange(range);
    }
  } catch (err) {
    input.insertAdjacentHTML('beforeend', toInsert);
  }
  renderDebounced();
}

/* =========================================================
   THAY THẾ TOÀN BỘ NỘI DUNG
   ========================================================= */
function replaceContent(html, text) {
  input.innerHTML = '';
  lastRenderSig = '';

  let toInsert;
  if (html && looksLikeHTML(html)) toInsert = sanitizeHTML(html);
  else toInsert = escapeHTML(text).replace(/\r?\n/g, '<br>');
  input.innerHTML = toInsert;

  resetScrollBtn();
  saveContentNow();
  render();
  setView('read');
  closeMenu();
}

/* =========================================================
   LƯU NỘI DUNG VÀO LOCALSTORAGE
   ========================================================= */
const CONTENT_KEY = 'readerContentDTC';
let saveContentTimer = null;

function saveContentNow() {
  try {
    localStorage.setItem(CONTENT_KEY, input.innerHTML);
  } catch (e) { /* bỏ qua */ }
}

function saveContentDebounced() {
  clearTimeout(saveContentTimer);
  saveContentTimer = setTimeout(saveContentNow, 10000);
}

function loadContent() {
  try {
    return localStorage.getItem(CONTENT_KEY) || '';
  } catch (e) {
    return '';
  }
}

function clearContent() {
  try { localStorage.removeItem(CONTENT_KEY); } catch (e) { /* bỏ qua */ }
}

window.addEventListener('beforeunload', saveContentNow);
window.addEventListener('pagehide', saveContentNow);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') saveContentNow();
});

/* =========================================================
   NÚT "LÊN ĐẦU" / "QUAY LẠI"
   ========================================================= */
let savedScrollPos = null;

function captureScrollPos() {
  return {
    windowY:      window.scrollY || window.pageYOffset || 0,
    sideInputTop: sideInput ? sideInput.scrollTop : 0,
    sideReadTop:  sideRead  ? sideRead.scrollTop  : 0
  };
}

function restoreScrollPos(pos) {
  if (!pos) return;

  try { window.scrollTo({ top: pos.windowY, behavior: 'smooth' }); }
  catch (e) { window.scrollTo(0, pos.windowY); }

  if (sideInput && pos.sideInputTop > 0) {
    try { sideInput.scrollTo({ top: pos.sideInputTop, behavior: 'smooth' }); }
    catch (e) { sideInput.scrollTop = pos.sideInputTop; }
  }
  if (sideRead && pos.sideReadTop > 0) {
    try { sideRead.scrollTo({ top: pos.sideReadTop, behavior: 'smooth' }); }
    catch (e) { sideRead.scrollTop = pos.sideReadTop; }
  }
}

function scrollToTop() {
  try { window.scrollTo({ top: 0, behavior: 'smooth' }); }
  catch (e) { window.scrollTo(0, 0); }

  if (document.documentElement) document.documentElement.scrollTop = 0;
  if (document.body) document.body.scrollTop = 0;

  if (sideInput) {
    try { sideInput.scrollTo({ top: 0, behavior: 'smooth' }); }
    catch (e) { sideInput.scrollTop = 0; }
  }
  if (sideRead) {
    try { sideRead.scrollTo({ top: 0, behavior: 'smooth' }); }
    catch (e) { sideRead.scrollTop = 0; }
  }
}

function setScrollBtnMode(mode) {
  if (mode === 'back') {
    scrollTopBtn.innerHTML = 'Quay<br>lại';
    scrollTopBtn.setAttribute('aria-label', 'Quay lại vị trí cũ');
    scrollTopBtn.title = 'Quay lại vị trí cũ';
  } else {
    scrollTopBtn.innerHTML = 'Lên<br>đầu';
    scrollTopBtn.setAttribute('aria-label', 'Cuộn lên đầu');
    scrollTopBtn.title = 'Cuộn lên đầu';
  }
}

function resetScrollBtn() {
  savedScrollPos = null;
  setScrollBtnMode('top');
}

scrollTopBtn.addEventListener('click', () => {
  scrollTopBtn.blur();

  if (savedScrollPos) {
    restoreScrollPos(savedScrollPos);
    savedScrollPos = null;
    setScrollBtnMode('top');
  } else {
    savedScrollPos = captureScrollPos();
    scrollToTop();
    setScrollBtnMode('back');
  }
});

/* =========================================================
   PASTE TRONG Ô NHẬP
   ========================================================= */
let composing = false;

input.addEventListener('compositionstart', () => { composing = true; });
input.addEventListener('compositionend', () => {
  composing = false;
  renderDebounced();
  saveContentDebounced();
});

input.addEventListener('paste', e => {
  if (!e.clipboardData) return;
  e.preventDefault();

  const html = e.clipboardData.getData('text/html');
  const text = e.clipboardData.getData('text/plain');
  insertAtCursor(html, text);
  saveContentDebounced();

  if (isMobile()) {
    if (document.activeElement && document.activeElement !== document.body) {
      document.activeElement.blur();
    }
    setTimeout(() => setView('read'), 180);
  }
});

input.addEventListener('input', () => {
  if (composing) return;
  renderDebounced();
  saveContentDebounced();
});

/* =========================================================
   PASTE TOÀN MÀN HÌNH — THAY THẾ
   ========================================================= */
document.addEventListener('paste', e => {
  if (e.target === input || (e.target && input.contains(e.target))) return;

  const ae = document.activeElement;
  if (ae && ae !== bodyEl && !input.contains(ae)) {
    const tag = ae.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  }

  if (!e.clipboardData) return;
  e.preventDefault();

  const html = e.clipboardData.getData('text/html');
  const text = e.clipboardData.getData('text/plain');
  if (!html && !text) return;

  replaceContent(html, text);

  if (isMobile()) {
    if (document.activeElement && document.activeElement !== document.body) {
      document.activeElement.blur();
    }
  }
});

/* =========================================================
   XỬ LÝ DÁN — nút Dán trong menu
   ========================================================= */
let isPasting = false;

async function handlePasteClick() {
  if (isPasting) return;
  isPasting = true;
  pasteBtn.disabled = true;
  pasteBtn.setAttribute('aria-busy', 'true');

  try {
    if (navigator.clipboard && navigator.clipboard.read) {
      try {
        const items = await navigator.clipboard.read();
        let gotHTML = '';
        let gotText = '';

        for (const item of items) {
          if (item.types.includes('text/html') && !gotHTML) {
            try {
              const blob = await item.getType('text/html');
              gotHTML = await blob.text();
            } catch (e) { /* bỏ qua */ }
          }
          if (item.types.includes('text/plain') && !gotText) {
            try {
              const blob = await item.getType('text/plain');
              gotText = await blob.text();
            } catch (e) { /* bỏ qua */ }
          }
        }

        if (gotHTML || gotText) {
          replaceContent(gotHTML, gotText);
          return;
        }
      } catch (err) { /* bị từ chối */ }
    }

    if (navigator.clipboard && navigator.clipboard.readText) {
      try {
        const text = await navigator.clipboard.readText();
        if (text && text.trim()) {
          replaceContent('', text);
          return;
        }
      } catch (err) { /* tiếp tục fallback */ }
    }

    showMessage(
      'Trình duyệt không cho phép đọc clipboard tự động.\n\n' +
      'Hãy nhấn giữ vào ô nhập và chọn Paste, hoặc dùng tổ hợp phím Ctrl+V / ⌘+V.',
      { type: 'warning', title: 'Không đọc được clipboard' }
    );
  } finally {
    isPasting = false;
    pasteBtn.disabled = false;
    pasteBtn.removeAttribute('aria-busy');
  }
}

pasteBtn.addEventListener('click', handlePasteClick);

/* =========================================================
   CHỌN FILE
   ========================================================= */
const MAX_FILE_SIZE = 5 * 1024 * 1024;
const ALLOWED_EXTS  = ['html', 'htm', 'txt'];
let isReadingFile = false;

fileBtn.addEventListener('click', () => {
  fileInput.click();
});

fileInput.addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  fileInput.value = '';
  if (!file) return;
  readFile(file);
});

function readFile(file) {
  if (isReadingFile) return;

  if (file.size > MAX_FILE_SIZE) {
    showMessage('File quá lớn. Chỉ hỗ trợ file tối đa 5MB.',
      { type: 'error', title: 'File quá lớn' });
    return;
  }

  const name = (file.name || '').toLowerCase();
  const dotIndex = name.lastIndexOf('.');
  const ext = dotIndex >= 0 ? name.slice(dotIndex + 1) : '';

  if (!ALLOWED_EXTS.includes(ext)) {
    showMessage('Chỉ hỗ trợ file .html, .htm, .txt',
      { type: 'error', title: 'Định dạng không hỗ trợ' });
    return;
  }

  isReadingFile = true;
  fileBtn.disabled = true;
  fileBtn.setAttribute('aria-busy', 'true');

  const fileReader = new FileReader();

  fileReader.onerror = () => {
    showMessage('Không đọc được file. Vui lòng thử lại.',
      { type: 'error', title: 'Lỗi đọc file' });
    isReadingFile = false;
    fileBtn.disabled = false;
    fileBtn.removeAttribute('aria-busy');
  };

  fileReader.onload = () => {
    const content = fileReader.result || '';
    replaceContent(content, content);

    isReadingFile = false;
    fileBtn.disabled = false;
    fileBtn.removeAttribute('aria-busy');
  };

  fileReader.readAsText(file, 'UTF-8');
}

/* =========================================================
   KÉO THẢ FILE (chỉ desktop)
   ========================================================= */
let dragCounter = 0;

function isFileDrag(e) {
  if (!e.dataTransfer) return false;
  const types = e.dataTransfer.types;
  if (!types) return false;
  return Array.from(types).includes('Files');
}

document.addEventListener('dragenter', e => {
  if (isMobile()) return;
  if (!isFileDrag(e)) return;
  e.preventDefault();
  dragCounter++;
  dropOverlay.classList.add('is-visible');
});

document.addEventListener('dragover', e => {
  if (isMobile()) return;
  if (!isFileDrag(e)) return;
  e.preventDefault();
  if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
});

document.addEventListener('dragleave', e => {
  if (isMobile()) return;
  if (!isFileDrag(e)) return;
  dragCounter--;
  if (dragCounter <= 0) {
    dragCounter = 0;
    dropOverlay.classList.remove('is-visible');
  }
});

document.addEventListener('drop', e => {
  if (isMobile()) return;
  if (!isFileDrag(e)) return;
  e.preventDefault();
  dragCounter = 0;
  dropOverlay.classList.remove('is-visible');

  const files = e.dataTransfer && e.dataTransfer.files;
  if (files && files.length > 0) {
    readFile(files[0]);
  }
});

const OPTS_KEY = 'readerOptsDTC';
let savedView = 'input';

function saveOpts() {
  try {
    localStorage.setItem(OPTS_KEY, JSON.stringify({
      fontSize:   fontSizeSel.value,
      fontFamily: fontFamilySel.value,
      lineHeight: lineHeightSel.value,
      maxWidth:   maxWidthSel.value,
      paperColor: paperColorSel.value,
      expanded:   main.classList.contains('reading-mode'),
      view:       main.dataset.view
    }));
  } catch (e) { /* bỏ qua */ }
}

function loadOpts() {
  try {
    const o = JSON.parse(localStorage.getItem(OPTS_KEY) || '{}');
    if (o.fontSize)   fontSizeSel.value   = o.fontSize;
    if (o.fontFamily) fontFamilySel.value = o.fontFamily;
    if (o.lineHeight) lineHeightSel.value = o.lineHeight;
    if (o.maxWidth)   maxWidthSel.value   = o.maxWidth;
    if (o.paperColor) paperColorSel.value = o.paperColor;

    if (o.expanded && !isMobile()) {
      main.classList.add('reading-mode');
      bodyEl.classList.add('is-fullscreen');
      expandBtn.classList.add('active');
      expandBtn.setAttribute('aria-label', 'Thoát chế độ toàn màn hình');
      expandBtn.title = 'Hiện lại tiêu đề';
    }

    if (o.view === 'read' || o.view === 'input') {
      savedView = o.view;
    }
  } catch (e) { /* bỏ qua */ }
}

function applyStyles() {
  root.style.setProperty('--reader-fs', fontSizeSel.value);
  root.style.setProperty('--reader-ff', fontFamilySel.value);
  root.style.setProperty('--reader-lh', lineHeightSel.value);
  root.style.setProperty('--reader-mw', maxWidthSel.value);
  bodyEl.classList.toggle('is-max-width', maxWidthSel.value === 'none');
  applyPaper();
  saveOpts();
}

function applyPaper() {
  if (paperColorSel.value === 'dark') {
    bodyEl.classList.add('dark');
  } else {
    bodyEl.classList.remove('dark');
    root.style.setProperty('--paper', paperColorSel.value);
  }
  updateThemeColor();
}

[fontSizeSel, fontFamilySel, lineHeightSel, maxWidthSel, paperColorSel].forEach(sel => {
  sel.addEventListener('change', applyStyles);
});

function slugify(s) {
  return (s || '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/đ/g, 'd')
    .replace(/Đ/g, 'D')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '')
    .slice(0, 60) || 'bai-viet';
}

function downloadFile(content, filename, mimeType) {
  const blob = new Blob([content], { type: mimeType + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);

  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.style.display = 'none';

  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);

  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function getArticleTitle() {
  const el = reader.querySelector('.article-title');

function getArticleBodyHTML() {

   ========================================================= */
shareBtn.addEventListener('click', async () => {
  if (!hasReadableContent()) return;

  const title = getArticleTitle();
  let text = reader.innerText.trim();

  if (!text) {
    showMessage('Chưa có nội dung để chia sẻ.', { type: 'warning' });
    return;
  }

  const MAX_LEN = 10000;
  if (text.length > MAX_LEN) {
    text = text.slice(0, MAX_LEN) + '…';
  }

  closeMenu();

  if (navigator.share) {
    try {
      await navigator.share({ title: title, text: text });
      return;
    } catch (err) {
      if (err && err.name === 'AbortError') return;
    }
  }

  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      showMessage(
        'Đã copy nội dung vào clipboard (trình duyệt không hỗ trợ chia sẻ trực tiếp).',
        { type: 'success', autoDismiss: 3000 }
      );
    } else {
      showMessage('Trình duyệt không hỗ trợ chia sẻ hoặc copy tự động.',
        { type: 'error' });
    }
  } catch (e) {
    showMessage('Không chia sẻ được.', { type: 'error' });
  }
});

/* =========================================================
   COPY BÀI VIẾT
   ========================================================= */
async function copyRich(html, text) {
  try {
    if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
      await navigator.clipboard.write([
        new ClipboardItem({
          'text/html':  new Blob([html], { type: 'text/html' }),
          'text/plain': new Blob([text], { type: 'text/plain' })
        })
      ]);
      return true;
    }
  } catch (e) { /* fallback */ }

  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.left = '-9999px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (e) {
    return false;
  }
}

function getPrimaryFontName(stack) {
  if (!stack) return 'serif';
  const first = (stack.split(',')[0] || '').trim().replace(/^['"]+|['"]+$/g, '');
  const map = {
    'system-ui':          'Segoe UI',
    '-apple-system':      'Segoe UI',
    'BlinkMacSystemFont': 'Segoe UI'
  };
  return map[first] || first;
}

function buildCopyWithReaderOptions() {
  const titleEl = reader.querySelector('.article-title');
  const bodyElm = reader.querySelector('.article-body');
  if (!bodyElm) return '';

  const fs = fontSizeSel.value;
  const ff = fontFamilySel.value;
  const lh = lineHeightSel.value;
  const mw = maxWidthSel.value;
  const maxWidthCSS = (mw === 'none') ? 'none' : mw;

  const primaryFont = getPrimaryFontName(ff);
  const ffCSS = '"' + primaryFont.replace(/"/g, '\\"') + '"';

  const clone = bodyElm.cloneNode(true);

  clone.removeAttribute('class');
  clone.querySelectorAll('[class]').forEach(el => el.removeAttribute('class'));

  const MONO_TAGS = new Set(['CODE', 'PRE', 'KBD', 'SAMP']);
  clone.querySelectorAll('*').forEach(el => {
    if (MONO_TAGS.has(el.tagName)) return;
    el.style.fontFamily = ffCSS;
  });

  applySVGLimitToImages(clone);

  clone.style.fontFamily = ffCSS;
  clone.style.fontSize = fs;
  clone.style.lineHeight = lh;

  let titleHTML = '';
  if (titleEl) {
    const t = titleEl.textContent.trim();
    if (t) {
      titleHTML =
        '<h1 style="font-family: ' + ffCSS + '; font-size: 1.9em; ' +
        'font-weight: bold; margin: 0 0 0.5em;">' +
        escapeHTML(t) + '</h1>';
    }
  }

  const wrapperStyle =
    'font-family: ' + ffCSS + '; font-size: ' + fs + '; ' +
    'line-height: ' + lh + '; max-width: ' + maxWidthCSS + ';';

  return '<div style="' + wrapperStyle + '">' +
           titleHTML +
           clone.outerHTML +
         '</div>';
}

copyBtn.addEventListener('click', async () => {
  if (copyBtn.disabled) return;
  copyBtn.disabled = true;
  copyBtn.setAttribute('aria-busy', 'true');

  try {
    const html = buildCopyWithReaderOptions();
    const text = reader.innerText;

    if (!text.trim() || !html) {
      showMessage('Chưa có nội dung để copy.', { type: 'warning' });
      return;
    }

    const ok = await copyRich(html, text);
    if (ok) {
      showMessage('Đã copy bài viết theo định dạng đang chọn!',
        { type: 'success', autoDismiss: 2500 });
    } else {
      showMessage('Trình duyệt không cho phép copy. Hãy bôi đen và giữ để chọn.',
        { type: 'error' });
    }
  } finally {
    copyBtn.removeAttribute('aria-busy');
    updateActionButtons();
    closeMenu();
  }
});

  const saved = loadContent();
  if (!saved) return;
  input.innerHTML = saved;

  setTimeout(() => {
    input.focus();
    try {
      const range = document.createRange();
      range.selectNodeContents(input);
      range.collapse(false);
      const sel = window.getSelection();
      if (sel) {
        sel.removeAllRanges();
        sel.addRange(range);
      }
    } catch (e) { /* bỏ qua */ }
  }, 300);
}
