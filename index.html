<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#faf9f6">
<title>Chế Độ Đọc - Dương Tấn Chánh</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,700;1,400&family=Roboto+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<style>
/* =========================================================
   1. RESET & BOX-SIZING
   ========================================================= */
*,
*::before,
*::after { box-sizing: border-box; }

html {
  margin: 0;
  padding: 0;
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  padding: 0.5rem 0.5rem 8rem;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 1.1rem;
  font-weight: normal;
  line-height: 1.5;
  color: var(--ink);
  background-color: var(--paper);
  word-break: normal;
  overflow-wrap: break-word;
  transition: background-color 0.2s, color 0.2s;
  min-height: 100vh;
}

body.menu-open {
  overflow: hidden;
}

body.modal-open {
  overflow: hidden;
}

/* =========================================================
   2. VARIABLES
   ========================================================= */
:root {
  --reader-fs: 1.5rem;
  --reader-lh: 1.75;
  --reader-mw: 37.5rem;
  --reader-ff: Georgia, "Times New Roman", "Noto Serif", serif;
  --svg-max-size: 12rem;
  --paper: #faf9f6;
  --ink: #1a1a1a;
  --line: #e6e1d6;
  --muted: #6b675c;
  --link: #b04a00;
  --accent: #2980b9;
  --accent-bg: rgba(52, 152, 219, 0.12);
  --accent-bg-hover: rgba(52, 152, 219, 0.22);
  --danger: #b3261e;
  --danger-bg: rgba(179, 38, 30, 0.1);
}

body.dark {
  --paper: #1c1a17;
  --ink: #d8d4cc;
  --line: #33302a;
  --muted: #9a958a;
  --link: #e8a06b;
  --accent: #6cb2eb;
  --accent-bg: rgba(108, 178, 235, 0.15);
  --accent-bg-hover: rgba(108, 178, 235, 0.25);
  --danger: #ef5350;
  --danger-bg: rgba(239, 83, 80, 0.15);
}

/* =========================================================
   3. BẢNG TUỲ CHỌN HỢP NHẤT (DRAWER DÙNG CHUNG MỌI MÀN HÌNH)
   ========================================================= */
.topbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  margin: 0 auto;
  max-width: 48rem;
  width: 100%;
  z-index: 300;
  max-height: 90vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  background-color: var(--paper);
  border: 2px solid var(--line);
  border-bottom: none;
  border-radius: 1rem 1rem 0 0;
  box-shadow: 0 -0.4rem 1.5rem rgba(0, 0, 0, 0.25);
  padding: 1rem 1rem max(1rem, env(safe-area-inset-bottom));
  transform: translateY(105%);
  transition: transform 0.25s ease-out;
  touch-action: manipulation;
}

.topbar.is-open {
  transform: translateY(0);
}

.menu-backdrop {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: rgba(0, 0, 0, 0.5);
  z-index: 290;
  -webkit-tap-highlight-color: transparent;
}

body.menu-open .menu-backdrop {
  display: block;
}

.page-header {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  margin: 0 0 0.6rem;
  padding: 0 2.5rem 0.4rem 0;
  border-bottom: 2px solid var(--line);
}

.page-header h1 {
  font-size: 2rem;
  font-weight: bold;
  text-align: center;
  text-transform: uppercase;
  letter-spacing: 0.04rem;
  line-height: 1.2;
  margin: 0;
  color: var(--ink);
}

.page-header .author {
  font-size: 1.1rem;
  font-weight: normal;
  color: var(--muted);
  margin: 0.2rem 0 0;
  text-align: right;
  align-self: flex-end;
  white-space: nowrap;
}

.menu-close {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  position: absolute;
  top: 0;
  right: 0;
  min-width: 2.2rem;
  min-height: 2.2rem;
  padding: 0;
  font-size: 1.1rem;
  line-height: 1;
  color: var(--ink);
  background-color: transparent;
  border: 2px solid var(--line);
  border-radius: 50%;
  cursor: pointer;
}

.menu-close:hover:not(:disabled) {
  border-color: var(--muted);
  background-color: rgba(128, 128, 128, 0.1);
}

/* =========================================================
   4. CÁC NHÓM CÔNG CỤ TRONG BẢNG TUỲ CHỌN
   ========================================================= */
.toolbar {
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
  padding: 0.2rem 0;
}

.toolbar-group {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.4rem 0.5rem;
  padding: 0.2rem 0;
  width: 100%;
}

.toolbar-group + .toolbar-group {
  border-top: 2px solid var(--line);
  padding-top: 0.6rem;
}

.toolbar-group-label {
  display: block;
  flex: 1 1 100%;
  font-size: 0.75rem;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
  margin: 0 0 0.15rem;
  pointer-events: none;
}

select,
button {
  font-family: inherit;
  font-size: 0.95rem;
  font-weight: normal;
  line-height: 1.4;
  color: var(--ink);
  background-color: transparent;
  border: 2px solid var(--line);
  padding: 0.45rem 0.75rem;
  min-height: 2.6rem;
  border-radius: 0.5rem;
  cursor: pointer;
  outline: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: background-color 0.12s, border-color 0.12s, opacity 0.12s, color 0.12s;
}

select { padding: 0.45rem 0.65rem; }
select:hover:not(:disabled) { border-color: var(--muted); }
select:disabled { opacity: 0.5; cursor: not-allowed; }

button:hover:not(:disabled) {
  background-color: rgba(128, 128, 128, 0.1);
  border-color: var(--muted);
}

button.active {
  color: var(--link);
  border-color: var(--link);
  font-weight: bold;
}

button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  pointer-events: none;
}

button:focus-visible,
select:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

#pasteBtn {
  background-color: var(--accent-bg);
  color: var(--accent);
  font-weight: bold;
  border-color: var(--accent);
}

#pasteBtn:hover:not(:disabled) {
  background-color: var(--accent-bg-hover);
  border-color: var(--accent);
}

#cleanBtn { color: var(--danger); }
#cleanBtn:hover:not(:disabled) {
  background-color: var(--danger-bg);
  border-color: var(--danger);
}

/* Font Size Stepper */
.font-stepper {
  display: inline-flex;
  align-items: center;
  border: 2px solid var(--line);
  border-radius: 0.5rem;
  overflow: hidden;
}

.font-stepper button {
  border: none;
  border-radius: 0;
  padding: 0.35rem 0.75rem;
  font-weight: bold;
  font-size: 1rem;
  min-width: 2.5rem;
}

.font-stepper button:hover:not(:disabled) {
  background-color: rgba(128, 128, 128, 0.12);
  border-color: transparent;
}

.font-size-display {
  padding: 0 0.55rem;
  font-size: 0.9rem;
  font-weight: bold;
  color: var(--muted);
  min-width: 4rem;
  text-align: center;
  border-left: 2px solid var(--line);
  border-right: 2px solid var(--line);
  align-self: stretch;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

/* Font Picker */
.font-picker {
  display: inline-flex;
  align-items: center;
  border: 2px solid var(--line);
  border-radius: 0.5rem;
  overflow: hidden;
  transition: border-color 0.12s;
}

.font-picker:hover { border-color: var(--muted); }
.font-picker:focus-within { border-color: var(--accent); }

.font-preview {
  padding: 0 0.6rem;
  font-size: 1.1rem;
  font-weight: bold;
  color: var(--muted);
  min-width: 2rem;
  text-align: center;
  line-height: 1;
  border-right: 2px solid var(--line);
  align-self: stretch;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.font-picker select {
  border: none;
  border-radius: 0;
  padding: 0.45rem 0.6rem;
}

.font-picker select:hover:not(:disabled) {
  border-color: transparent;
  background-color: rgba(128, 128, 128, 0.08);
}

.font-picker select:focus-visible { outline: none; }

.btn-toggle { gap: 0.4rem; }
.btn-toggle svg {
  flex: 0 0 auto;
  width: 1.1em;
  height: 1.1em;
}

/* Dropdown Xuất (Mở xuống dưới nhóm Hành động) */
.dropdown {
  position: relative;
  display: inline-flex;
}

.dropdown-toggle {
  justify-content: space-between;
}

.dropdown-toggle::after {
  content: '▾';
  margin-left: 0.4rem;
  font-size: 0.8em;
  opacity: 0.7;
}

.dropdown-toggle[aria-expanded="true"],
.dropdown-toggle[aria-expanded="true"]:hover:not(:disabled) {
  border-color: var(--accent);
  background-color: var(--accent-bg);
  color: var(--accent);
}

.dropdown-menu {
  position: absolute;
  top: calc(100% + 0.3rem);
  left: 0;
  min-width: 11.5rem;
  background-color: var(--paper);
  border: 2px solid var(--line);
  border-radius: 0.6rem;
  box-shadow: 0 0.5rem 1.4rem rgba(0, 0, 0, 0.22);
  padding: 0.35rem;
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
  z-index: 400;
}

.dropdown-menu[hidden] { display: none; }

.dropdown-menu button {
  border: none;
  width: 100%;
  justify-content: flex-start;
  text-align: left;
  padding: 0.55rem 0.8rem;
  min-height: 2.4rem;
}

.dropdown-menu button:hover:not(:disabled) {
  background-color: rgba(128, 128, 128, 0.12);
  border-color: transparent;
}

/* =========================================================
   5. KHUNG XEM TRƯỚC 2 DÒNG (NẰM DƯỚI CÙNG TRONG TUỲ CHỌN)
   ========================================================= */
.format-preview {
  font-family: var(--reader-ff);
  font-size: var(--reader-fs);
  line-height: var(--reader-lh);
  color: var(--ink);
  background-color: rgba(128, 128, 128, 0.05);
  border: 2px solid var(--line);
  border-radius: 0.6rem;
  padding: 0.6rem 0.8rem;
  margin-top: 0.4rem;
  width: 100%;
  word-break: normal;
  overflow-wrap: break-word;
  transition: font-size 0.15s, line-height 0.15s, color 0.2s, background-color 0.2s;
  user-select: none;
  pointer-events: none;
}

/* =========================================================
   6. BỐ CỤC CHÍNH (CHUYỂN ĐỔI SỬA / ĐỌC TOÀN MÀN HÌNH)
   ========================================================= */
body.is-max-width #reader {
  max-width: none;
  width: 100%;
  margin: 0;
}

.main {
  display: block;
  width: 100%;
  min-height: 70vh;
}

.side-input,
.side-read {
  display: none;
  width: 100%;
}

.main[data-view="input"] .side-input { display: block; }
.main[data-view="read"] .side-read { display: block; }

/* =========================================================
   7. KHUNG SOẠN THẢO (#input) — PHÓNG TO THEO A+/A-
   ========================================================= */
#input {
  width: 100%;
  min-height: 70vh;
  border: none;
  background-color: transparent;
  color: var(--ink);
  outline: none;
  font-family: inherit;
  font-size: var(--reader-fs);
  font-weight: normal;
  line-height: 1.6;
  word-break: normal;
  overflow-wrap: break-word;
  padding: 0 0 2rem;
  display: block;
  transition: font-size 0.15s ease;
}

#input:empty::before {
  content: attr(data-placeholder);
  color: var(--muted);
  font-style: normal;
  pointer-events: none;
  display: block;
  white-space: pre-line;
  line-height: 1.7;
  font-size: max(0.95rem, calc(var(--reader-fs) * 0.7));
}

#input img {
  max-width: 100%;
  height: auto;
  display: block;
  margin: 0.5rem 0;
}

#input img[src$=".svg"],
#input img[src*=".svg?"],
#input img[src*=".svg#"],
#input img[src^="data:image/svg+xml"] {
  max-width: min(100%, var(--svg-max-size));
  max-height: var(--svg-max-size);
}

#input h1 { font-size: 1.4em; font-weight: bold; margin: 0.6em 0 0.3em; }
#input h2 { font-size: 1.25em; font-weight: bold; margin: 0.6em 0 0.3em; }
#input h3 { font-size: 1.15em; font-weight: bold; margin: 0.6em 0 0.3em; }
#input ul, #input ol { padding-left: 1.6rem; margin: 0.4rem 0; }
#input blockquote {
  margin: 0.6rem 0;
  padding: 0;
  color: var(--muted);
  font-style: italic;
}

#input pre {
  background-color: transparent;
  padding: 0;
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: 0.9em;
  overflow-x: auto;
}

/* =========================================================
   8. VÙNG ĐỌC BÀI VIẾT (#reader)
   ========================================================= */
#reader {
  max-width: var(--reader-mw);
  margin: 0 auto;
  padding: 0.5rem 0.5rem 2rem;
  font-family: var(--reader-ff);
  font-size: var(--reader-fs);
  font-weight: normal;
  line-height: var(--reader-lh);
  color: var(--ink);
  word-break: normal;
  overflow-wrap: break-word;
  transition: font-size 0.15s ease;
}

#reader .article-title {
  font-family: inherit;
  font-size: 1.9em;
  font-weight: bold;
  margin: 0 0 0.5rem;
  color: var(--ink);
  text-align: left;
  text-transform: none;
  letter-spacing: normal;
}

#reader .article-meta {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 0.8em;
  font-weight: normal;
  color: var(--muted);
  margin: 0 0 2rem;
  letter-spacing: 0.02em;
  text-transform: none;
}

#reader .article-meta .dot { margin: 0 0.5em; opacity: 0.5; }
#reader .article-body > *:first-child { margin-top: 0; }
#reader .article-body > *:last-child { margin-bottom: 0; }

#reader p { margin: 0 0 1.1em; }

#reader h1, #reader h2, #reader h3, #reader h4, #reader h5, #reader h6 {
  font-family: inherit;
  font-weight: bold;
  color: var(--ink);
  text-align: left;
  text-transform: none;
  letter-spacing: normal;
}

#reader h1 { font-size: 1.5em; margin: 1.5em 0 0.6em; }
#reader h2 { font-size: 1.3em; margin: 1.4em 0 0.5em; }
#reader h3 { font-size: 1.15em; margin: 1.2em 0 0.5em; }
#reader h4 { font-size: 1em; margin: 1.1em 0 0.4em; }

#reader h5, #reader h6 {
  font-size: 0.9em;
  margin: 1em 0 0.4em;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--muted);
}

#reader a {
  color: var(--link);
  text-decoration: underline;
  text-underline-offset: 0.15em;
  word-break: break-word;
}

#reader img {
  max-width: 100%;
  height: auto;
  display: block;
  margin: 1.2em auto;
}

#reader img[src$=".svg"],
#reader img[src*=".svg?"],
#reader img[src*=".svg#"],
#reader img[src^="data:image/svg+xml"] {
  max-width: min(100%, var(--svg-max-size));
  max-height: var(--svg-max-size);
}

#reader figure { margin: 1.2em 0; }
#reader figcaption {
  font-family: inherit;
  font-size: 0.9em;
  color: var(--muted);
  text-align: center;
  margin-top: 0.4em;
}

#reader ul, #reader ol { margin: 0.6em 0 1.1em; padding-left: 1.6em; }
#reader li { margin: 0.35em 0; }

#reader blockquote {
  margin: 1.2em 0;
  padding: 0;
  border: none;
  color: var(--muted);
  font-style: italic;
}

#reader blockquote p:last-child { margin-bottom: 0; }

#reader hr {
  border: none;
  border-top: 2px solid var(--line);
  margin: 2em auto;
  width: 30%;
}

#reader code {
  font-family: "Roboto Mono", Consolas, ui-monospace, Menlo, Monaco, "Liberation Mono", "DejaVu Sans Mono", monospace;
  font-size: 0.9em;
}

#reader pre {
  border: none;
  padding: 0;
  margin: 1em 0;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  font-family: "Roboto Mono", Consolas, ui-monospace, Menlo, Monaco, "Liberation Mono", "DejaVu Sans Mono", monospace;
  font-size: 0.9em;
}

#reader details {
  margin: 1em 0;
  padding: 0;
  border: none;
  font-size: 0.95em;
  color: var(--muted);
}

#reader summary {
  cursor: pointer;
  font-weight: bold;
  color: var(--ink);
}

#reader mark {
  background-color: #fff3a3;
  color: #1a1a1a;
  padding: 0 0.15em;
}

body.dark #reader mark {
  background-color: #8a7a00;
  color: #ffffff;
}

#reader b, #reader strong { font-weight: bold; }
#reader i, #reader em { font-style: italic; }
#reader u { text-decoration: underline; }
#reader s, #reader del {
  text-decoration: line-through;
  color: var(--muted);
}
#reader sub, #reader sup { font-size: 0.75em; line-height: 0; }
#reader small { font-size: 0.85em; color: var(--muted); }

#reader .blocked-media {
  display: inline-block;
  padding: 0 0.3em;
  color: var(--muted);
  font-size: 0.85em;
  font-style: italic;
}

#reader .placeholder {
  text-align: center;
  color: var(--muted);
  padding: 3rem 1rem;
  font-size: max(0.95rem, calc(var(--reader-fs) * 0.65));
  line-height: 1.8;
}

#reader .placeholder .big {
  display: block;
  font-size: 1.6em;
  font-weight: bold;
  margin-bottom: 1rem;
  opacity: 0.4;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

#reader .placeholder .title {
  font-size: 1.15em;
  color: var(--ink);
  font-weight: bold;
  margin-bottom: 0.8rem;
}

#reader .placeholder .hint {
  font-size: 0.95em;
  background-color: rgba(128, 128, 128, 0.08);
  padding: 0.8rem 1rem;
  border-radius: 0.5rem;
  margin-top: 1rem;
  display: inline-block;
  text-align: left;
  line-height: 1.7;
}

#reader .placeholder .hint kbd {
  background-color: rgba(128, 128, 128, 0.2);
  padding: 0.1rem 0.4rem;
  border-radius: 0.25rem;
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: 0.9em;
}

#reader .extract-note {
  font-size: 0.85em;
  color: var(--muted);
  padding: 0;
  border: none;
  margin-bottom: 1.2em;
  font-style: italic;
}

/* =========================================================
   9. MODAL, OVERLAY & CÁC NÚT ĐIỀU KHIỂN NỔI
   ========================================================= */
.drop-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: rgba(26, 26, 26, 0.85);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  pointer-events: none;
}

.drop-overlay.is-visible { display: flex; }

.drop-overlay-inner {
  background-color: var(--paper);
  color: var(--ink);
  padding: 1rem;
  border-radius: 1rem;
  border: 3px dashed var(--accent);
  text-align: center;
  font-size: 1.5rem;
  font-weight: bold;
}

.drop-overlay-hint {
  display: block;
  font-size: 1rem;
  font-weight: normal;
  color: var(--muted);
  margin-top: 0.8rem;
}

.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: rgba(0, 0, 0, 0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2000;
  padding: 1rem;
  visibility: hidden;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease-out, visibility 0s 0.2s;
}

.modal-overlay.is-visible {
  visibility: visible;
  opacity: 1;
  pointer-events: auto;
  transition: opacity 0.2s ease-out, visibility 0s 0s;
}

.modal-card {
  position: relative;
  background-color: var(--paper);
  color: var(--ink);
  border: 2px solid var(--line);
  border-radius: 1rem;
  box-shadow: 0 1.2rem 3rem rgba(0, 0, 0, 0.4);
  padding: 1rem;
  max-width: 34rem;
  width: 100%;
  text-align: center;
  transform: translateY(0.6rem) scale(0.97);
  transition: transform 0.2s ease-out;
}

.modal-overlay.is-visible .modal-card {
  transform: translateY(0) scale(1);
}

.modal-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 3rem;
  height: 3rem;
  margin: 0 0 0.8rem;
}

.modal-icon svg { width: 100%; height: 100%; display: block; }
.modal-icon.info    { color: var(--accent); }
.modal-icon.success { color: #2e7d32; }
.modal-icon.error   { color: #c62828; }
.modal-icon.warning { color: #ef6c00; }

body.dark .modal-icon.info    { color: var(--accent); }
body.dark .modal-icon.success { color: #81c784; }
body.dark .modal-icon.error   { color: #ef5350; }
body.dark .modal-icon.warning { color: #ffb74d; }

.modal-title {
  font-size: 1.3rem;
  font-weight: bold;
  line-height: 1.3;
  margin: 0 0 0.6rem;
  color: var(--ink);
}

.modal-message {
  font-size: 1rem;
  line-height: 1.6;
  color: var(--ink);
  margin: 0 0 1.2rem;
  white-space: pre-line;
  word-break: break-word;
  text-align: left;
}

.modal-actions {
  display: flex;
  gap: 0.7rem;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 0.6rem;
}

.modal-btn {
  font-family: inherit;
  font-size: 1rem;
  font-weight: bold;
  line-height: 1;
  padding: 0.8rem 1.8rem;
  min-width: 7rem;
  color: var(--paper);
  background-color: var(--ink);
  border: 2px solid var(--ink);
  border-radius: 0.6rem;
  cursor: pointer;
  outline: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  transition: opacity 0.12s;
}

.modal-btn:hover,
.modal-btn:focus-visible { opacity: 0.85; }

.modal-btn-cancel {
  color: var(--ink);
  background-color: transparent;
  border-color: var(--line);
}

.modal-btn-cancel:hover,
.modal-btn-cancel:focus-visible {
  background-color: rgba(128, 128, 128, 0.12);
  opacity: 1;
}

/* Các nút nổi dùng chung mọi màn hình */
.floating-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 3.2rem;
  min-height: 3.2rem;
  padding: 0.4rem 0.8rem;
  font-family: inherit;
  font-size: 0.85rem;
  font-weight: bold;
  line-height: 1.15;
  text-align: center;
  color: var(--paper);
  background-color: var(--ink);
  border: 2px solid transparent;
  border-radius: 0.8rem;
  box-shadow: 0 0.2rem 0.6rem rgba(0, 0, 0, 0.3);
  cursor: pointer;
  outline: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

button.floating-btn:hover,
button.floating-btn:active {
  background-color: var(--ink);
  color: var(--paper);
}

.bottom-left {
  display: flex;
  position: fixed;
  bottom: max(1rem, env(safe-area-inset-bottom));
  left: max(1rem, env(safe-area-inset-left));
  z-index: 100;
  gap: 0.5rem;
}

body.menu-open .bottom-left,
body.menu-open .scroll-top,
body.modal-open .bottom-left,
body.modal-open .scroll-top {
  display: none;
}

.scroll-top {
  position: fixed;
  bottom: max(1rem, env(safe-area-inset-bottom));
  right: max(1rem, env(safe-area-inset-right));
  z-index: 100;
  padding: 0.55rem;
}

.scroll-top svg {
  display: block;
  width: 1.7rem;
  height: 1.7rem;
}

/* =========================================================
   10. KIỂU IN (Print Stylesheet)
   ========================================================= */
@media print {
  @page { margin: 2cm; }

  html, body {
    background: #ffffff !important;
    background-color: #ffffff !important;
    color: #000000 !important;
    height: auto !important;
    overflow: visible !important;
    display: block !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  .topbar,
  .side-input,
  .menu-backdrop,
  .bottom-left,
  .scroll-top,
  .drop-overlay,
  .modal-overlay {
    display: none !important;
  }

  .main,
  .side-read {
    display: block !important;
    overflow: visible !important;
    height: auto !important;
    padding: 0 !important;
    background: #ffffff !important;
  }

  #reader {
    display: block !important;
    max-width: none !important;
    width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
    color: #000000 !important;
  }

  #reader, #reader * {
    background: transparent !important;
    color: #000000 !important;
  }

  #reader img[src$=".svg"],
  #reader img[src*=".svg?"],
  #reader img[src*=".svg#"],
  #reader img[src^="data:image/svg+xml"] {
    max-width: min(100%, 12rem) !important;
    max-height: 12rem !important;
  }

  #reader a {
    color: #000000 !important;
    text-decoration: underline !important;
  }

  #reader img, #reader figure, #reader pre {
    page-break-inside: avoid;
  }

  #reader .article-title,
  #reader h1, #reader h2, #reader h3, #reader h4, #reader h5, #reader h6 {
    page-break-after: avoid;
  }

  #reader .placeholder { display: none !important; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

<script>
/* =========================================================
   THAM CHIẾU PHẦN TỬ
   ========================================================= */
const input          = document.getElementById('input');
const reader         = document.getElementById('reader');
const main           = document.getElementById('main');
const topbar         = document.getElementById('topbar');
const menuBtn        = document.getElementById('menuBtn');
const menuCloseBtn   = document.getElementById('menuCloseBtn');
const menuBackdrop   = document.getElementById('menuBackdrop');
const viewBtn        = document.getElementById('viewBtn');
const pasteBtn       = document.getElementById('pasteBtn');
const fileBtn        = document.getElementById('fileBtn');
const fileInput      = document.getElementById('fileInput');
const copyBtn        = document.getElementById('copyBtn');
const printBtn       = document.getElementById('printBtn');
const cleanBtn       = document.getElementById('cleanBtn');
const scrollTopBtn   = document.getElementById('scrollTopBtn');
const dropOverlay    = document.getElementById('dropOverlay');
const fontFamilySel  = document.getElementById('fontFamily');
const lineHeightSel  = document.getElementById('lineHeight');
const maxWidthSel    = document.getElementById('maxWidth');
const paperColorSel  = document.getElementById('paperColor');
const exportTxtBtn   = document.getElementById('exportTxtBtn');
const exportHtmlBtn  = document.getElementById('exportHtmlBtn');
const shareBtn       = document.getElementById('shareBtn');
const formatPreview  = document.getElementById('formatPreview');
const bodyEl         = document.body;
const root           = document.documentElement;

const fontMinus       = document.getElementById('fontMinus');
const fontPlus        = document.getElementById('fontPlus');
const fontSizeDisplay = document.getElementById('fontSizeDisplay');
const FONT_STEPS      = ['1rem','1.1rem','1.2rem','1.3rem','1.5rem','1.75rem','2rem','2.25rem','2.5rem'];
let   fontIndex       = 4;

const fontPreview = document.getElementById('fontPreview');
const darkToggle  = document.getElementById('darkToggle');

const exportToggle = document.getElementById('exportToggle');
const exportMenu   = document.getElementById('exportMenu');

const modalOverlay   = document.getElementById('modalOverlay');
const modalIcon      = document.getElementById('modalIcon');
const modalTitle     = document.getElementById('modalTitle');
const modalMsg       = document.getElementById('modalMsg');
const modalBtn       = document.getElementById('modalBtn');
const modalCancelBtn = document.getElementById('modalCancelBtn');

const SVG_MAX_SIZE = '12rem';
const SVG_MAX_WIDTH_CSS = 'min(100%, ' + SVG_MAX_SIZE + ')';

/* =========================================================
   CẬP NHẬT CHỮ MẪU VÀ NGÀY THÁNG THỜI GIAN THỰC
   ========================================================= */
function updatePreviewText() {
  const now = new Date();
  const days = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
  const thu = days[now.getDay()];
  const d = now.getDate();
  const m = now.getMonth() + 1;
  const y = now.getFullYear();

  formatPreview.innerHTML =
    'AaBbCc Đđ Ăă Ââ Êê Ôô Ơơ Ưư 0123456789<br>' +
    'Hôm nay là ' + thu + ', ngày ' + d + '/' + m + '/' + y;
}

/* =========================================================
   MODAL THÔNG BÁO
   ========================================================= */
let modalAutoTimer     = null;
let modalOnConfirm     = null;
let modalOnCancel      = null;
let modalPreviousFocus = null;

const MODAL_ICONS = {
  info:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>',
  success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
  error:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
  warning: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>'
};

const MODAL_DEFAULT_TITLES = {
  info:    'Thông báo',
  success: 'Thành công',
  error:   'Lỗi',
  warning: 'Cảnh báo'
};

function showMessage(message, opts) {
  opts = opts || {};
  const type         = opts.type || 'info';
  const title        = (opts.title !== undefined) ? opts.title : (MODAL_DEFAULT_TITLES[type] || 'Thông báo');
  const buttonLabel  = opts.buttonLabel || 'OK';
  const cancelLabel  = opts.cancelLabel || '';
  const autoDismiss  = opts.autoDismiss || 0;

  if (modalAutoTimer) {
    clearTimeout(modalAutoTimer);
    modalAutoTimer = null;
  }
  modalOnConfirm = opts.onClose || null;
  modalOnCancel  = opts.onCancel || null;

  modalPreviousFocus = (document.activeElement && document.activeElement !== bodyEl)
    ? document.activeElement
    : null;

  modalIcon.innerHTML = MODAL_ICONS[type] || MODAL_ICONS.info;
  modalIcon.className = 'modal-icon ' + type;

  if (title) {
    modalTitle.textContent   = title;
    modalTitle.style.display = '';
  } else {
    modalTitle.textContent   = '';
    modalTitle.style.display = 'none';
  }

  modalMsg.textContent  = message || '';
  modalBtn.textContent  = buttonLabel;

  if (cancelLabel) {
    modalCancelBtn.textContent   = cancelLabel;
    modalCancelBtn.style.display = '';
  } else {
    modalCancelBtn.textContent   = '';
    modalCancelBtn.style.display = 'none';
  }

  bodyEl.classList.add('modal-open');
  modalOverlay.classList.add('is-visible');

  setTimeout(() => {
    try { modalBtn.focus(); } catch (e) { /* bỏ qua */ }
  }, 60);

  if (autoDismiss > 0) {
    modalAutoTimer = setTimeout(() => hideModal('confirm'), autoDismiss);
  }
}

function hideModal(action) {
  if (!modalOverlay.classList.contains('is-visible')) return;

  if (modalAutoTimer) {
    clearTimeout(modalAutoTimer);
    modalAutoTimer = null;
  }

  modalOverlay.classList.remove('is-visible');
  bodyEl.classList.remove('modal-open');

  if (modalPreviousFocus &&
      modalPreviousFocus.isConnected &&
      typeof modalPreviousFocus.focus === 'function' &&
      !modalPreviousFocus.disabled) {
    try { modalPreviousFocus.focus(); } catch (e) { /* bỏ qua */ }
  }
  modalPreviousFocus = null;

  const isCancel = (action === 'cancel');
  const cb = isCancel ? modalOnCancel : modalOnConfirm;
  modalOnConfirm = null;
  modalOnCancel  = null;

  if (typeof cb === 'function') {
    try { cb(); } catch (e) { /* bỏ qua */ }
  }
}

modalBtn.addEventListener('click', () => hideModal('confirm'));
modalCancelBtn.addEventListener('click', () => hideModal('cancel'));

modalOverlay.addEventListener('click', e => {
  if (e.target === modalOverlay) hideModal('cancel');
});

function trapFocus(e) {
  const focusables = [];
  if (modalCancelBtn.style.display !== 'none') focusables.push(modalCancelBtn);
  focusables.push(modalBtn);

  if (focusables.length === 0) return;

  const first  = focusables[0];
  const last   = focusables[focusables.length - 1];
  const active = document.activeElement;

  if (focusables.length === 1) {
    e.preventDefault();
    first.focus();
    return;
  }

  if (e.shiftKey) {
    if (active === first || !focusables.includes(active)) {
      e.preventDefault();
      last.focus();
    }
  } else {
    if (active === last || !focusables.includes(active)) {
      e.preventDefault();
      first.focus();
    }
  }
}

/* =========================================================
   DROPDOWN XUẤT
   ========================================================= */
function closeExportMenu() {
  if (!exportMenu.hidden) {
    exportMenu.hidden = true;
    exportToggle.setAttribute('aria-expanded', 'false');
  }
}

exportToggle.addEventListener('click', e => {
  e.stopPropagation();
  const willOpen = exportMenu.hidden;
  exportMenu.hidden = !willOpen;
  exportToggle.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
});

document.addEventListener('click', e => {
  if (exportMenu.hidden) return;
  if (exportMenu.contains(e.target)) return;
  if (e.target === exportToggle) return;
  closeExportMenu();
});

/* =========================================================
   MENU TUỲ CHỌN HỢP NHẤT
   ========================================================= */
function openMenu() {
  updatePreviewText();
  bodyEl.classList.add('menu-open');
  topbar.classList.add('is-open');
}

function closeMenu() {
  bodyEl.classList.remove('menu-open');
  topbar.classList.remove('is-open');
  closeExportMenu();
}

menuBtn.addEventListener('click', openMenu);
menuCloseBtn.addEventListener('click', closeMenu);
menuBackdrop.addEventListener('click', closeMenu);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (modalOverlay.classList.contains('is-visible')) {
      e.preventDefault();
      e.stopPropagation();
      if (modalCancelBtn.style.display !== 'none') {
        hideModal('cancel');
      } else {
        hideModal('confirm');
      }
      return;
    }
    if (!dropOverlay.classList.contains('is-visible') && dragCounter > 0) {
      dragCounter = 0;
      dropOverlay.classList.remove('is-visible');
    }
    if (!exportMenu.hidden) {
      closeExportMenu();
      try { exportToggle.focus(); } catch (err) { /* bỏ qua */ }
      return;
    }
    if (bodyEl.classList.contains('menu-open')) {
      closeMenu();
    }
    return;
  }

  if (e.key === 'Tab' && modalOverlay.classList.contains('is-visible')) {
    trapFocus(e);
  }
});

/* =========================================================
   THEME COLOR
   ========================================================= */
function updateThemeColor() {
  const meta = document.querySelector('meta[name="theme-color"]');
  if (!meta) return;
  if (bodyEl.classList.contains('dark')) {
    meta.setAttribute('content', '#1c1a17');
  } else {
    meta.setAttribute('content', paperColorSel.value);
  }
}

/* =========================================================
   BỘ LỌC BẢO MẬT & URL (XSS PROTECTION)
   ========================================================= */
const BLANK_RE = /[\s\u00A0\u200B\u200C\u200D\uFEFF\u2060]+/g;
function stripBlank(s) { return (s || '').replace(BLANK_RE, ''); }

function looksLikeHTML(text) {
  return /<\/?[a-z][\s\S]*>/i.test((text || '').trim());
}

function escapeHTML(s) {
  return s.replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
}

/* Chặn triệt để giao thức nguy hiểm; cho phép ảnh tương đối và ảnh an toàn */
function safeURL(url, isImage) {
  if (!url) return '';
  const t = url.trim();
  if (/^(javascript|vbscript):/i.test(t)) return '';
  if (isImage) {
    if (/^data:image\/(png|jpe?g|gif|webp|svg\+xml);/i.test(t)) return t;
    if (/^blob:/i.test(t)) return t;
    if (!/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(t) || /^(https?:)/i.test(t)) return t;
    return '';
  }
  if (/^data:/i.test(t)) return '';
  if (/^(https?:|mailto:|tel:|#)/i.test(t)) return t;
  if (!/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(t)) return t;
  return '';
}

function isSVGSource(src) {
  if (!src) return false;
  const s = String(src).toLowerCase().trim();
  return s.startsWith('data:image/svg+xml') || s.indexOf('.svg') !== -1;
}

function applySVGLimitToImages(rootEl) {
  rootEl.querySelectorAll('img').forEach(img => {
    const src = img.getAttribute('src') || '';
    if (isSVGSource(src)) {
      img.style.maxWidth = SVG_MAX_WIDTH_CSS;
      img.style.maxHeight = SVG_MAX_SIZE;
    }
  });
}

const ALLOWED_STYLE_PROPS = new Set([
  'text-align', 'font-weight', 'font-style', 'text-decoration',
  'text-transform', 'letter-spacing', 'list-style-type',
  'max-width', 'max-height'
]);

function filterStyle(text) {
  if (!text) return '';
  const kept = [];
  text.split(';').forEach(rule => {
    const i = rule.indexOf(':');
    if (i < 0) return;
    const prop  = rule.slice(0, i).trim().toLowerCase();
    const value = rule.slice(i + 1).trim();
    if (!ALLOWED_STYLE_PROPS.has(prop)) return;
    if (/expression|javascript:|url\s*\(/i.test(value)) return;
    kept.push(prop + ': ' + value);
  });
  return kept.join('; ');
}

const ALLOWED_TAGS = new Set([
  'p', 'div', 'section', 'article', 'figure', 'figcaption',
  'h1', 'h2', 'h3', 'h4', 'h5', 'h6',
  'ul', 'ol', 'li', 'dl', 'dt', 'dd',
  'blockquote', 'pre', 'hr', 'br',
  'details', 'summary',
  'a', 'span', 'strong', 'b', 'em', 'i', 'u', 's', 'del', 'ins', 'sub', 'sup',
  'mark', 'small', 'code', 'kbd', 'samp', 'var', 'abbr', 'cite', 'q', 'time', 'address',
  'img'
]);

const ALLOWED_ATTRS = {
  '*':       new Set(['title', 'dir', 'lang', 'style']),
  'a':       new Set(['href', 'name']),
  'img':     new Set(['src', 'alt', 'width', 'height']),
  'ol':      new Set(['start', 'type', 'reversed']),
  'li':      new Set(['value']),
  'time':    new Set(['datetime']),
  'details': new Set(['open'])
};

const STRIP_WITH_CONTENT = new Set([
  'script', 'style', 'noscript', 'template', 'iframe', 'object', 'embed',
  'form', 'input', 'textarea', 'select', 'option', 'button',
  'svg', 'math', 'canvas', 'video', 'audio', 'source', 'track',
  'link', 'meta', 'base', 'title', 'head',
  'table', 'thead', 'tbody', 'tfoot', 'tr', 'th', 'td', 'caption', 'col', 'colgroup'
]);

function hasVisibleContent(node) {
  if (node.nodeType === 3) return stripBlank(node.textContent).length > 0;
  if (node.nodeType !== 1) return false;

  const tag = node.tagName;
  if (['IMG', 'HR', 'VIDEO', 'AUDIO', 'IFRAME', 'TABLE',
       'UL', 'OL', 'BLOCKQUOTE', 'PRE', 'FIGURE', 'DETAILS',
       'H1', 'H2', 'H3', 'H4', 'H5', 'H6'].includes(tag)) return true;
  if (tag === 'BR') return false;

  if (stripBlank(node.textContent).length > 0) return true;
  if (node.querySelector('img, hr, ul, ol, blockquote, pre, figure, details, table')) return true;
  return false;
}

function flattenTables(rootEl) {
  const tables = Array.from(rootEl.querySelectorAll('table')).reverse();
  for (const t of tables) {
    if (!t.isConnected) continue;

    const frag = document.createDocumentFragment();
    let rows = [];
    try { rows = Array.from(t.rows); }
    catch (e) { rows = Array.from(t.querySelectorAll('tr')); }

    rows.forEach(tr => {
      let cells = [];
      try { cells = Array.from(tr.cells); }
      catch (e) { cells = Array.from(tr.querySelectorAll('th, td')); }
      if (!cells.length) return;

      const p = document.createElement('p');
      let hasContent = false;

      cells.forEach(cell => {
        const text = stripBlank(cell.textContent);
        const hasRealMedia = !!cell.querySelector('img');
        if (!text && !hasRealMedia) return;
        if (hasContent) p.appendChild(document.createTextNode(' · '));
        while (cell.firstChild) p.appendChild(cell.firstChild);
        hasContent = true;
      });

      if (hasContent) frag.appendChild(p);
    });

    if (frag.childNodes.length) t.replaceWith(frag);
    else t.remove();
  }
}

function unwrapSingleChildWrappers(rootEl) {
  let changed = true;
  let loops = 0;
  while (changed && loops++ < 4) {
    changed = false;
    rootEl.querySelectorAll('div, section, article').forEach(el => {
      if (!el.isConnected) return;
      const kids = Array.from(el.childNodes).filter(n =>
        n.nodeType === 1 || (n.nodeType === 3 && stripBlank(n.textContent))
      );
      if (kids.length === 1 && kids[0].nodeType === 1) {
        const parent = el.parentNode;
        if (!parent) return;
        parent.insertBefore(kids[0], el);
        el.remove();
        changed = true;
      }
    });
  }
}

function stripInlineFontStyles(rootEl) {
  rootEl.querySelectorAll('[style]').forEach(el => {
    if (!el.style) return;
    el.style.removeProperty('font-size');
    el.style.removeProperty('font-family');
    el.style.removeProperty('line-height');
    el.style.removeProperty('font');

    if (!el.getAttribute('style')) el.removeAttribute('style');
  });
}

function sanitizeHTML(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  flattenTables(doc.body);

  const all = Array.from(doc.body.querySelectorAll('*'));
  for (const el of all) {
    if (!el.isConnected) continue;
    const tag = el.tagName.toLowerCase();

    if (STRIP_WITH_CONTENT.has(tag)) { el.remove(); continue; }

    if (!ALLOWED_TAGS.has(tag)) {
      const parent = el.parentNode;
      if (!parent) continue;
      while (el.firstChild) parent.insertBefore(el.firstChild, el);
      el.remove();
      continue;
    }

    const allowed = new Set([
      ...(ALLOWED_ATTRS['*'] || []),
      ...(ALLOWED_ATTRS[tag] || [])
    ]);

    Array.from(el.attributes).forEach(attr => {
      const name  = attr.name.toLowerCase();
      const value = attr.value;

      if (name.startsWith('on')) { el.removeAttribute(attr.name); return; }
      if (name === 'class' || name === 'id') { el.removeAttribute(attr.name); return; }

      if (name === 'style') {
        const clean = filterStyle(value);
        if (clean) el.setAttribute('style', clean);
        else el.removeAttribute('style');
        return;
      }

      if (!allowed.has(name)) { el.removeAttribute(attr.name); return; }

      if (tag === 'img' && (name === 'width' || name === 'height')) {
        const num = parseInt(value, 10);
        if (!Number.isFinite(num) || num <= 0 || num > 4096) {
          el.removeAttribute(attr.name);
        } else {
          el.setAttribute(name, String(num));
        }
        return;
      }

      if (name === 'href') {
        const clean = safeURL(value, false);
        if (clean) el.setAttribute(name, clean);
        else el.removeAttribute(name);
      } else if (name === 'src') {
        const clean = safeURL(value, true);
        if (clean) el.setAttribute(name, clean);
        else el.removeAttribute(name);
      }
    });

    if (tag === 'a' && el.hasAttribute('href')) {
      el.setAttribute('target', '_blank');
      el.setAttribute('rel', 'noopener noreferrer');
    }

    if (tag === 'img' && !el.hasAttribute('src')) {
      const span = doc.createElement('span');
      span.className = 'blocked-media';
      span.textContent = '[ảnh]';
      el.replaceWith(span);
    }
  }

  stripInlineFontStyles(doc.body);
  unwrapSingleChildWrappers(doc.body);
  return doc.body.innerHTML;
}

const NOISE_SELECTORS = [
  'script', 'style', 'noscript', 'template', 'iframe', 'object', 'embed',
  'nav', 'header', 'footer', 'aside',
  '[role="navigation"]', '[role="banner"]', '[role="complementary"]',
  '[role="search"]', '[role="menu"]', '[role="menubar"]', '[role="dialog"]',
  'form', 'input', 'button', 'select', 'textarea', 'label',
  'svg', 'canvas', 'video', 'audio', 'source', 'track',
  'link', 'meta', 'base'
].join(',');

const NOISE_CLASS_RE = new RegExp(
  '(^|[-_ ])(' +
    'ad|ads|advert|advertisement|sponsor|sponsored|promo|banner|' +
    'sidebar|side-bar|rail|' +
    'menu|nav|navbar|navigation|breadcrumb|toolbar|topbar|' +
    'comment|comments|comment-list|comment-form|disqus|' +
    'social|share|sharing|share-bar|share-buttons|follow|' +
    'related|recommend|recommended|more-from|read-next|read-more|' +
    'newsletter|subscribe|signup|cta|call-to-action|' +
    'cookie|consent|gdpr|privacy-banner|' +
    'popup|modal|overlay|lightbox|' +
    'masthead|site-header|site-footer|page-header|page-footer|' +
    'widget|widgets|' +
    'byline|author-info|author-box|author-bio|author-avatar|' +
    'timestamp|publish-date|posted-on|date-published|' +
    'tags|tag-list|post-tags|article-tags|' +
    'rating|vote|votes|star-rating|' +
    'print|email-this|save-this|bookmark|' +
    'post-nav|prev-next|next-prev|pagination|pager|' +
    'meta|meta-info|post-meta|article-meta-strip|' +
    'skip-link|skip-to|screen-reader' +
  ')([-_ ]|$)', 'i'
);

function removeNoise(doc) {
  doc.querySelectorAll(NOISE_SELECTORS).forEach(el => el.remove());

  doc.querySelectorAll('[class],[id]').forEach(el => {
    if (!el.isConnected) return;
    const cls = (typeof el.className === 'string') ? el.className : '';
    if (NOISE_CLASS_RE.test(cls + ' ' + (el.id || ''))) el.remove();
  });

  let changed = true;
  let loops = 0;
  while (changed && loops++ < 8) {
    changed = false;
    doc.querySelectorAll('div, section, span, li, article, p, aside').forEach(el => {
      if (!el.isConnected) return;
      if (!hasVisibleContent(el)) { el.remove(); changed = true; }
    });
  }
}

function scoreElement(el) {
  const text = (el.textContent || '').trim();
  const textLen = text.length;
  if (textLen < 120) return 0;

  let pScore = 0;
  let pCount = 0;
  el.querySelectorAll('p').forEach(p => {
    const len = (p.textContent || '').trim().length;
    if (len >= 30) { pScore += len; pCount++; }
  });
  const base = pScore > 0 ? pScore : textLen;

  let linkLen = 0;
  el.querySelectorAll('a').forEach(a => linkLen += (a.textContent || '').trim().length);
  const linkDensity = textLen > 0 ? linkLen / textLen : 1;

  const tag = el.tagName.toLowerCase();
  let tagBoost = 1;
  if (tag === 'article') tagBoost = 3.2;
  else if (tag === 'main') tagBoost = 2.6;
  else if (tag === 'section') tagBoost = 1.25;

  const pBoost = 1 + Math.min(pCount, 12) * 0.05;
  let score = base * tagBoost * pBoost;
  score *= Math.max(0.04, 1 - linkDensity * 1.8);
  return score;
}

function findMainContainer(doc) {
  const cands = doc.body.querySelectorAll('article, main, [role="main"], section, div');
  let best = null;
  let bestScore = 0;
  cands.forEach(el => {
    const s = scoreElement(el);
    if (s > bestScore) { bestScore = s; best = el; }
  });
  return best || doc.body;
}

function extractTitle(doc, mainEl) {
  let h1 = mainEl.querySelector('h1') || doc.body.querySelector('h1');
  if (h1) {
    const t = h1.textContent.trim();
    if (t.length >= 4 && t.length <= 300) { h1.remove(); return t; }
  }

  const og = doc.querySelector('meta[property="og:title"], meta[name="og:title"]');
  if (og && og.getAttribute('content')) return og.getAttribute('content').trim();

  const t = doc.querySelector('title');
  if (t) {
    let s = t.textContent.trim();
    s = s.split(/\s+[|\-–—»·]\s+/)[0].trim();
    if (s.length >= 4) return s;
  }
  return '';
}

function normalizeBreaks(rootEl) {
  rootEl.querySelectorAll('*').forEach(el => {
    let prevBr = false;
    Array.from(el.childNodes).forEach(node => {
      if (node.nodeType === 1 && node.tagName === 'BR') {
        if (prevBr) node.remove(); else prevBr = true;
      } else if (node.nodeType === 3) {
        if (stripBlank(node.textContent)) prevBr = false;
      } else if (node.nodeType === 1) {
        prevBr = false;
      }
    });
  });

  rootEl.querySelectorAll('p, div, li, blockquote, h1, h2, h3, h4, h5, h6, article, section')
    .forEach(el => {
      while (el.lastChild) {
        const last = el.lastChild;
        if ((last.nodeType === 1 && last.tagName === 'BR') ||
            (last.nodeType === 3 && !stripBlank(last.textContent))) last.remove();
        else break;
      }
      while (el.firstChild) {
        const first = el.firstChild;
        if ((first.nodeType === 1 && first.tagName === 'BR') ||
            (first.nodeType === 3 && !stripBlank(first.textContent))) first.remove();
        else break;
      }
    });
}

function removeEmptyBlocks(rootEl) {
  let changed = true;
  let loops = 0;
  while (changed && loops++ < 8) {
    changed = false;
    const blocks = Array.from(
      rootEl.querySelectorAll('p, div, section, article, aside, span, li')
    ).filter(el => el.isConnected).reverse();
    for (const el of blocks) {
      if (!hasVisibleContent(el)) { el.remove(); changed = true; }
    }
  }
}

function trimEdges(container) {
  while (container.lastChild && !hasVisibleContent(container.lastChild)) {
    container.lastChild.remove();
  }
  while (container.firstChild && !hasVisibleContent(container.firstChild)) {
    container.firstChild.remove();
  }
}

function wrapLooseTextInParagraphs(rootEl) {
  if (rootEl.querySelectorAll('p').length > 0) return;

  const html = rootEl.innerHTML;
  if (!stripBlank(html)) return;

  const parts = html.split(/(?:<br\s*\/?>\s*){2,}/i);

  const wrapped = parts
    .map(part => {
      const cleaned = part
        .replace(/^(?:\s*<br\s*\/?>\s*)+/i, '')
        .replace(/(?:\s*<br\s*\/?>\s*)+$/i, '')
        .trim();
      return cleaned ? '<p>' + cleaned + '</p>' : '';
    })
    .filter(Boolean)
    .join('');

  if (wrapped) rootEl.innerHTML = wrapped;
}

function countStatsFromNode(containerEl) {
  const text = containerEl.textContent || '';
  const words = text.split(/\s+/).filter(w => /[\p{L}\p{N}]/u.test(w)).length;
  const minutes = words === 0 ? 0 : Math.max(1, Math.round(words / 220));
  return { words, minutes };
}

function extractArticle(rawHTML) {
  const doc = new DOMParser().parseFromString(rawHTML, 'text/html');
  removeNoise(doc);
  const mainEl = findMainContainer(doc);
  const title  = extractTitle(doc, mainEl);
  const cleanHTML = sanitizeHTML(mainEl.innerHTML);

  const wrap = document.createElement('div');
  wrap.innerHTML = cleanHTML;
  wrapLooseTextInParagraphs(wrap);
  normalizeBreaks(wrap);
  removeEmptyBlocks(wrap);
  trimEdges(wrap);

  let note = '';
  if (stripBlank(wrap.textContent).length < 200) {
    note = 'Không tìm thấy bài viết rõ ràng — hiển thị toàn bộ nội dung đọc được.';
  }
  const stats = countStatsFromNode(wrap);
  return { title, bodyHTML: wrap.innerHTML, note, stats };
}

function isEmptySource(src) {
  if (!src || !src.trim()) return true;
  try {
    const tmp = document.createElement('div');
    tmp.innerHTML = src;
    if (tmp.querySelector('img, hr, video, audio, iframe, table, pre, blockquote')) return false;
    if (stripBlank(tmp.textContent)) return false;
    return true;
  } catch (e) {
    return !stripBlank(src);
  }
}

/* =========================================================
   CHUYỂN ĐỔI CHẾ ĐỘ SỬA / ĐỌC
   ========================================================= */
function setView(view) {
  main.dataset.view = view;
  window.scrollTo(0, 0);

  if (view === 'read') {
    viewBtn.innerHTML = 'Đọc<br>▶ Sửa';
    viewBtn.setAttribute('aria-label', 'Quay lại ô nhập');
    viewBtn.title = 'Quay lại ô nhập';
  } else {
    viewBtn.innerHTML = 'Sửa<br>▶ Đọc';
    viewBtn.setAttribute('aria-label', 'Chuyển sang chế độ đọc');
    viewBtn.title = 'Chuyển sang chế độ đọc';
    if (!bodyEl.classList.contains('menu-open') && document.activeElement !== input) {
      setTimeout(() => {
        try { input.focus(); } catch (e) { /* bỏ qua */ }
      }, 80);
    }
  }
  saveOpts();
}

viewBtn.addEventListener('click', () => {
  const next = main.dataset.view === 'read' ? 'input' : 'read';
  if (next === 'read' &&
      document.activeElement &&
      document.activeElement !== document.body) {
    document.activeElement.blur();
  }
  setView(next);
  closeMenu();
});

let _hasContentCache    = null;
let _hasContentCacheSig = '';

function hasReadableContent() {
  const sig = lastRenderSig;
  if (_hasContentCache !== null && _hasContentCacheSig === sig) {
    return _hasContentCache;
  }
  const result = !reader.querySelector('.placeholder')
      && stripBlank(reader.textContent).length > 0;
  _hasContentCache    = result;
  _hasContentCacheSig = sig;
  return result;
}

function updateActionButtons() {
  const has = hasReadableContent();
  copyBtn.disabled = !has;
  copyBtn.title = has ? 'Copy bài viết theo định dạng đang chọn' : 'Chưa có nội dung để copy';

  printBtn.disabled = !has;
  printBtn.title = has ? 'In bài viết' : 'Chưa có nội dung để in';

  exportTxtBtn.disabled = !has;
  exportTxtBtn.title = has ? 'Tải nội dung thành file .txt' : 'Chưa có nội dung để tải';

  exportHtmlBtn.disabled = !has;
  exportHtmlBtn.title = has ? 'Tải nội dung thành file .html' : 'Chưa có nội dung để tải';

  shareBtn.disabled = !has;
  shareBtn.title = has ? 'Chia sẻ bài viết' : 'Chưa có nội dung để chia sẻ';
}

let lastRenderSig = '';

function render() {
  const src = input.innerHTML;

  if (isEmptySource(src)) {
    reader.innerHTML =
      '<div class="placeholder">' +
        '<span class="big">Chế độ đọc</span>' +
        '<div class="title">Chưa có nội dung</div>' +
        '<div>Dán văn bản hoặc mở file để bắt đầu.</div>' +
        '<div class="hint">' +
          '<b>Cách sử dụng:</b><br>' +
          '• Bấm nút <kbd>Tuỳ Chọn</kbd> ở góc dưới trái để dán, mở file, chỉnh cỡ chữ, phông chữ, màu nền<br>' +
          '• Bấm <kbd>Sửa ▶ Đọc</kbd> để chuyển đổi giữa màn hình gõ và màn hình đọc<br>' +
          '• Bấm <kbd>A+</kbd> hoặc <kbd>A−</kbd> để phóng to/thu nhỏ cỡ chữ cả khi đọc và sửa<br>' +
          '• Kéo thả file .html, .htm, .txt vào màn hình để mở nhanh' +
        '</div>' +
      '</div>';
    lastRenderSig = '';
    _hasContentCache    = null;
    _hasContentCacheSig = '';
    updateActionButtons();
    return;
  }

  let title = '';
  let bodyHTML = '';
  let note = '';
  let stats = { words: 0, minutes: 0 };

  if (looksLikeHTML(src)) {
    const r = extractArticle(src);
    title = r.title;
    bodyHTML = r.bodyHTML;
    note = r.note;
    stats = r.stats;
  } else {
    bodyHTML = src.split(/\n\s*\n/)
      .map(b => '<p>' + escapeHTML(b).replace(/\n/g, '<br>') + '</p>')
      .join('');
    const tmp = document.createElement('div');
    tmp.innerHTML = bodyHTML;
    stats = countStatsFromNode(tmp);
  }

  let html = '';
  if (title) {
    html += '<h1 class="article-title">' + escapeHTML(title) + '</h1>';
  }
  html += '<div class="article-meta">' +
            stats.words.toLocaleString('vi-VN') + ' từ' +
            '<span class="dot">·</span>~' + stats.minutes + ' phút đọc' +
          '</div>';
  if (note) {
    html += '<div class="extract-note">' + escapeHTML(note) + '</div>';
  }
  html += '<div class="article-body">' + bodyHTML + '</div>';

  const sig = title + '\u0001' + bodyHTML;
  lastRenderSig = sig;
  reader.innerHTML = html;

  _hasContentCache    = null;
  _hasContentCacheSig = '';

  updateActionButtons();
}

let renderTimer = null;
function renderDebounced() {
  clearTimeout(renderTimer);
  renderTimer = setTimeout(render, 120);
}

function insertAtCursor(html, text) {
  let toInsert;
  if (html && looksLikeHTML(html)) toInsert = sanitizeHTML(html);
  else toInsert = escapeHTML(text).replace(/\r?\n/g, '<br>');

  const sel = window.getSelection();
  if (!sel) return;

  if (sel.rangeCount === 0 || !input.contains(sel.anchorNode)) {
    input.focus();
    const range = document.createRange();
    range.selectNodeContents(input);
    range.collapse(false);
    sel.removeAllRanges();
    sel.addRange(range);
  }

  try {
    if (sel.rangeCount === 0) return;
    const range = sel.getRangeAt(0);
    range.deleteContents();
    const frag = range.createContextualFragment(toInsert);
    const last = frag.lastChild;
    range.insertNode(frag);
    if (last) {
      range.setStartAfter(last);
      range.collapse(true);
      sel.removeAllRanges();
      sel.addRange(range);
    }
  } catch (err) {
    input.insertAdjacentHTML('beforeend', toInsert);
  }
  renderDebounced();
}

function replaceContent(html, text) {
  input.innerHTML = '';
  lastRenderSig = '';

  let toInsert;
  if (html && looksLikeHTML(html)) toInsert = sanitizeHTML(html);
  else toInsert = escapeHTML(text).replace(/\r?\n/g, '<br>');
  input.innerHTML = toInsert;

  resetScrollBtn();
  saveContentNow();
  render();
  setView('read');
  closeMenu();
}

const SCROLL_ICON_TOP =
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" ' +
  'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  '<line x1="12" y1="19" x2="12" y2="5"/>' +
  '<polyline points="5 12 12 5 19 12"/></svg>';

const SCROLL_ICON_BACK =
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" ' +
  'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  '<polyline points="9 14 4 9 9 4"/>' +
  '<path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>';

function captureScrollPos() {
  return window.scrollY || window.pageYOffset || 0;
}

function restoreScrollPos(posY) {
  try { window.scrollTo({ top: posY, behavior: 'smooth' }); }
  catch (e) { window.scrollTo(0, posY); }
}

function scrollToTop() {
  try { window.scrollTo({ top: 0, behavior: 'smooth' }); }
  catch (e) { window.scrollTo(0, 0); }
  if (document.documentElement) document.documentElement.scrollTop = 0;
  if (document.body) document.body.scrollTop = 0;
}

function setScrollBtnMode(mode) {
  if (mode === 'back') {
    scrollTopBtn.innerHTML = SCROLL_ICON_BACK;
    scrollTopBtn.setAttribute('aria-label', 'Quay lại vị trí cũ');
    scrollTopBtn.title = 'Quay lại vị trí cũ';
  } else {
    scrollTopBtn.innerHTML = SCROLL_ICON_TOP;
    scrollTopBtn.setAttribute('aria-label', 'Cuộn lên đầu');
    scrollTopBtn.title = 'Cuộn lên đầu';
  }
}

function resetScrollBtn() {
  savedScrollPos = null;
  setScrollBtnMode('top');
}

scrollTopBtn.addEventListener('click', () => {
  scrollTopBtn.blur();
  if (savedScrollPos !== null) {
    restoreScrollPos(savedScrollPos);
    savedScrollPos = null;
    setScrollBtnMode('top');
  } else {
    savedScrollPos = captureScrollPos();
    scrollToTop();
    setScrollBtnMode('back');
  }
});

  if (!e.clipboardData) return;

  const html = e.clipboardData.getData('text/html');
  const text = e.clipboardData.getData('text/plain');
  insertAtCursor(html, text);

  if (document.activeElement && document.activeElement !== document.body) {
    document.activeElement.blur();
  }

document.addEventListener('paste', e => {
  if (e.target === input || (e.target && input.contains(e.target))) return;

  const ae = document.activeElement;
  if (ae && ae !== bodyEl && !input.contains(ae)) {
    const tag = ae.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  }

  if (!e.clipboardData) return;
  e.preventDefault();

  const html = e.clipboardData.getData('text/html');
  const text = e.clipboardData.getData('text/plain');
  if (!html && !text) return;

  replaceContent(html, text);
  if (document.activeElement && document.activeElement !== document.body) {
    document.activeElement.blur();
  }
});

let isPasting = false;

async function handlePasteClick() {
  if (isPasting) return;
  isPasting = true;
  pasteBtn.disabled = true;
  pasteBtn.setAttribute('aria-busy', 'true');

  try {
    if (navigator.clipboard && navigator.clipboard.read) {
      try {
        const items = await navigator.clipboard.read();
        let gotHTML = '';
        let gotText = '';

        for (const item of items) {
          if (item.types.includes('text/html') && !gotHTML) {
            try {
              const blob = await item.getType('text/html');
              gotHTML = await blob.text();
            } catch (e) { /* bỏ qua */ }
          }
          if (item.types.includes('text/plain') && !gotText) {
            try {
              const blob = await item.getType('text/plain');
              gotText = await blob.text();
            } catch (e) { /* bỏ qua */ }
          }
        }

        if (gotHTML || gotText) {
          replaceContent(gotHTML, gotText);
          return;
        }
      } catch (err) { /* Bị chặn quyền */ }
    }

    if (navigator.clipboard && navigator.clipboard.readText) {
      try {
        const text = await navigator.clipboard.readText();
        if (text && text.trim()) {
          replaceContent('', text);
          return;
        }
      } catch (err) { /* Fallback */ }
    }

    showMessage(
      'Trình duyệt không cho phép đọc clipboard tự động.\n\nHãy nhấn giữ vào ô nhập và chọn Dán, hoặc dùng tổ hợp phím Ctrl+V / ⌘+V.',
      { type: 'warning', title: 'Không đọc được clipboard' }
    );
  } finally {
    isPasting = false;
    pasteBtn.disabled = false;
    pasteBtn.removeAttribute('aria-busy');
  }
}

pasteBtn.addEventListener('click', handlePasteClick);

const MAX_FILE_SIZE = 5 * 1024 * 1024;
const ALLOWED_EXTS  = ['html', 'htm', 'txt'];
let isReadingFile = false;

fileBtn.addEventListener('click', () => { fileInput.click(); });

fileInput.addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  fileInput.value = '';
  if (!file) return;
  readFile(file);
});

function readFile(file) {
  if (isReadingFile) return;

  if (file.size > MAX_FILE_SIZE) {
    showMessage('File quá lớn. Chỉ hỗ trợ file tối đa 5MB.',
      { type: 'error', title: 'File quá lớn' });
    return;
  }

  const name = (file.name || '').toLowerCase();
  const dotIndex = name.lastIndexOf('.');
  const ext = dotIndex >= 0 ? name.slice(dotIndex + 1) : '';

  if (!ALLOWED_EXTS.includes(ext)) {
    showMessage('Chỉ hỗ trợ file .html, .htm, .txt',
      { type: 'error', title: 'Định dạng không hỗ trợ' });
    return;
  }

  isReadingFile = true;
  fileBtn.disabled = true;
  fileBtn.setAttribute('aria-busy', 'true');

  const fileReader = new FileReader();

  fileReader.onerror = () => {
    showMessage('Không đọc được file. Vui lòng thử lại.',
      { type: 'error', title: 'Lỗi đọc file' });
    isReadingFile = false;
    fileBtn.disabled = false;
    fileBtn.removeAttribute('aria-busy');
  };

  fileReader.onload = () => {
    const content = fileReader.result || '';
    replaceContent(content, content);
    isReadingFile = false;
    fileBtn.disabled = false;
    fileBtn.removeAttribute('aria-busy');
  };

  fileReader.readAsText(file, 'UTF-8');
}

let dragCounter = 0;

function isFileDrag(e) {
  if (modalOverlay.classList.contains('is-visible')) return false;
  if (!e.dataTransfer) return false;
  const types = e.dataTransfer.types;
  if (!types) return false;
  return Array.from(types).includes('Files');
}

document.addEventListener('dragenter', e => {
  if (!isFileDrag(e)) return;
  e.preventDefault();
  dragCounter++;
  dropOverlay.classList.add('is-visible');
});

document.addEventListener('dragover', e => {
  if (!isFileDrag(e)) return;
  e.preventDefault();
  if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
});

document.addEventListener('dragleave', e => {
  if (!isFileDrag(e)) return;
  dragCounter--;
  if (dragCounter <= 0) {
    dragCounter = 0;
    dropOverlay.classList.remove('is-visible');
  }
});

document.addEventListener('drop', e => {
  if (!isFileDrag(e)) return;
  e.preventDefault();
  dragCounter = 0;
  dropOverlay.classList.remove('is-visible');

  const files = e.dataTransfer && e.dataTransfer.files;
  if (files && files.length > 0) {
    readFile(files[0]);
  }
});

window.addEventListener('dragend', () => {
  dragCounter = 0;
  dropOverlay.classList.remove('is-visible');
});

const OPTS_KEY = 'readerOptsDTC';
let savedView = 'input';

function saveOpts() {
  try {
    localStorage.setItem(OPTS_KEY, JSON.stringify({
      fontSize:   FONT_STEPS[fontIndex],
      fontFamily: fontFamilySel.value,
      lineHeight: lineHeightSel.value,
      maxWidth:   maxWidthSel.value,
      paperColor: paperColorSel.value,
      darkMode:   bodyEl.classList.contains('dark'),
      view:       main.dataset.view
    }));
  } catch (e) { /* bỏ qua */ }
}

function loadOpts() {
  try {
    const o = JSON.parse(localStorage.getItem(OPTS_KEY) || '{}');

    if (o.fontSize) {
      const idx = FONT_STEPS.indexOf(o.fontSize);
      if (idx >= 0) fontIndex = idx;
    }
    if (o.fontFamily) fontFamilySel.value = o.fontFamily;
    if (o.lineHeight) lineHeightSel.value = o.lineHeight;
    if (o.maxWidth)   maxWidthSel.value   = o.maxWidth;
    if (o.paperColor && o.paperColor !== 'dark') paperColorSel.value = o.paperColor;

    const wantDark = !!o.darkMode || o.paperColor === 'dark';

    if (wantDark) {
      bodyEl.classList.add('dark');
      darkToggle.setAttribute('aria-pressed', 'true');
      darkToggle.querySelector('span').textContent = 'Nền sáng';
      darkToggle.title = 'Tắt nền tối';
      paperColorSel.disabled = true;
    }

    if (o.view === 'read' || o.view === 'input') {
      savedView = o.view;
    }
  } catch (e) { /* bỏ qua */ }
}

function applyStyles() {
  const fsVal = FONT_STEPS[fontIndex];
  const ffVal = fontFamilySel.value;
  const lhVal = lineHeightSel.value;
  const mwVal = maxWidthSel.value;

  root.style.setProperty('--reader-fs', fsVal);
  root.style.setProperty('--reader-ff', ffVal);
  root.style.setProperty('--reader-lh', lhVal);
  root.style.setProperty('--reader-mw', mwVal);

  bodyEl.classList.toggle('is-max-width', mwVal === 'none');
  applyPaper();
  saveOpts();
}

function applyPaper() {
  if (bodyEl.classList.contains('dark')) {
    root.style.removeProperty('--paper');
  } else {
    root.style.setProperty('--paper', paperColorSel.value);
  }
  updateThemeColor();
}

function updateFontDisplay() {
  fontSizeDisplay.textContent = FONT_STEPS[fontIndex];
  fontMinus.disabled = (fontIndex === 0);
  fontPlus.disabled  = (fontIndex === FONT_STEPS.length - 1);
}

function setFontSize(delta) {
  const next = Math.max(0, Math.min(FONT_STEPS.length - 1, fontIndex + delta));
  if (next === fontIndex) return;
  fontIndex = next;
  updateFontDisplay();
  applyStyles();
}

fontMinus.addEventListener('click', () => setFontSize(-1));
fontPlus.addEventListener('click', () => setFontSize(+1));

function updateFontPreview() {
  fontPreview.style.fontFamily = fontFamilySel.value;

function slugify(s) {
  return (s || '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/đ/g, 'd')
    .replace(/Đ/g, 'D')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '')
    .slice(0, 60) || 'bai-viet';
}

function downloadFile(content, filename, mimeType) {
  const blob = new Blob([content], { type: mimeType + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);

  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.style.display = 'none';

  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);

  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

shareBtn.addEventListener('click', async () => {
  if (!hasReadableContent()) return;

  const title = getArticleTitle();
  let text = reader.innerText.trim();

  if (!text) {
    showMessage('Chưa có nội dung để chia sẻ.', { type: 'warning' });
    return;
  }

  const MAX_LEN = 10000;
  if (text.length > MAX_LEN) {
    text = text.slice(0, MAX_LEN) + '…';
  }

  closeExportMenu();
  closeMenu();

  if (navigator.share) {
    try {
      await navigator.share({ title: title, text: text });
      return;
    } catch (err) {
      if (err && err.name === 'AbortError') return;
    }
  }

  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      showMessage(
        'Đã copy nội dung vào clipboard (trình duyệt không hỗ trợ chia sẻ trực tiếp).',
        { type: 'success', autoDismiss: 3000 }
      );
    } else {
      showMessage('Trình duyệt không hỗ trợ chia sẻ hoặc copy tự động.',
        { type: 'error' });
    }
  } catch (e) {
    showMessage('Không chia sẻ được.', { type: 'error' });
  }
});

async function copyRich(html, text) {
  try {
    if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
      await navigator.clipboard.write([
        new ClipboardItem({
          'text/html':  new Blob([html], { type: 'text/html' }),
          'text/plain': new Blob([text], { type: 'text/plain' })
        })
      ]);
      return true;
    }
  } catch (e) { /* Fallback */ }

  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.left = '-9999px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (e) {
    return false;
  }
}

function getPrimaryFontName(stack) {
  if (!stack) return 'serif';
  const first = (stack.split(',')[0] || '').trim().replace(/^['"]+|['"]+$/g, '');
  const map = {
    'system-ui':          'Segoe UI',
    '-apple-system':      'Segoe UI',
    'BlinkMacSystemFont': 'Segoe UI'
  };
  return map[first] || first;
}

function buildCopyWithReaderOptions() {
  const titleEl = reader.querySelector('.article-title');
  const bodyElm = reader.querySelector('.article-body');
  if (!bodyElm) return '';

  const fs = FONT_STEPS[fontIndex];
  const ff = fontFamilySel.value;
  const lh = lineHeightSel.value;
  const mw = maxWidthSel.value;
  const maxWidthCSS = (mw === 'none') ? 'none' : mw;

  const primaryFont = getPrimaryFontName(ff);
  const ffCSS = '"' + primaryFont.replace(/"/g, '\\"') + '"';

  const clone = bodyElm.cloneNode(true);
  clone.removeAttribute('class');
  clone.querySelectorAll('[class]').forEach(el => el.removeAttribute('class'));

  const MONO_TAGS = new Set(['CODE', 'PRE', 'KBD', 'SAMP']);
  clone.querySelectorAll('*').forEach(el => {
    if (MONO_TAGS.has(el.tagName)) return;
    el.style.fontFamily = ffCSS;
  });

  applySVGLimitToImages(clone);

  clone.style.fontFamily = ffCSS;
  clone.style.fontSize = fs;
  clone.style.lineHeight = lh;

  let titleHTML = '';
  if (titleEl) {
    const t = titleEl.textContent.trim();
    if (t) {
      titleHTML =
        '<h1 style="font-family: ' + ffCSS + '; font-size: 1.9em; ' +
        'font-weight: bold; margin: 0 0 0.5em;">' +
        escapeHTML(t) + '</h1>';
    }
  }

  const wrapperStyle =
    'font-family: ' + ffCSS + '; font-size: ' + fs + '; ' +
    'line-height: ' + lh + '; max-width: ' + maxWidthCSS + ';';

  return '<div style="' + wrapperStyle + '">' +
           titleHTML +
           clone.outerHTML +
         '</div>';
}

copyBtn.addEventListener('click', async () => {
  if (copyBtn.disabled) return;
  copyBtn.disabled = true;
  copyBtn.setAttribute('aria-busy', 'true');

  try {
    const html = buildCopyWithReaderOptions();
    const text = reader.innerText;

    if (!text.trim() || !html) {
      showMessage('Chưa có nội dung để copy.', { type: 'warning' });
      return;
    }

    const ok = await copyRich(html, text);
    if (ok) {
      showMessage('Đã copy bài viết theo định dạng đang chọn!',
        { type: 'success', autoDismiss: 2500 });
    } else {
      showMessage('Trình duyệt không cho phép copy. Hãy bôi đen và giữ để chọn.',
        { type: 'error' });
    }
  } finally {
    copyBtn.removeAttribute('aria-busy');
    updateActionButtons();
    closeMenu();
  }
});

loadOpts();
updateFontDisplay();
updateFontPreview();
updatePreviewText();

(function restoreContent() {
  const saved = loadContent();
  if (!saved) return;
  input.innerHTML = saved;
  lastRenderSig = '';
})();

applyStyles();
render();

if (savedView === 'read' && !reader.querySelector('.placeholder')) {
  setView('read');
} else {
  setView('input');
}

/* Tự động bật bảng Tuỳ Chọn khi mới khởi động để người dùng nhận diện phần mềm */
openMenu();
</script>
